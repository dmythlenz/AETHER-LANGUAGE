<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Æther OS Ultimate — Aether Language · ASI Core</title>
  <style>
    /* ===== global reset & variables ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #050508;
      --surface: #0b0b11;
      --panel: #13131b;
      --elevated: #1b1b25;
      --border: #2a2a36;
      --text: #f1f1f7;
      --dim: #8c8ca0;
      --accent: #8b7cff;
      --accent2: #c4b5fd;
      --green: #34d399;
      --orange: #fbbf24;
      --red: #f87171;
      --font: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", monospace;
      --shadow: 0 18px 50px rgba(0,0,0,0.55);
    }
    .theme-light {
      --bg: #f0f0f5;
      --surface: #e8e8ef;
      --panel: #d8d8e0;
      --elevated: #c8c8d0;
      --border: #b0b0b8;
      --text: #1a1a22;
      --dim: #5a5a6a;
      --shadow: 0 18px 50px rgba(0,0,0,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: grid;
      grid-template-rows: 36px 1fr 48px;
      transition: background 0.3s, color 0.3s;
    }
    /* top bar */
    .topbar {
      background: rgba(11,11,17,0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .theme-light .topbar { background: rgba(232,232,239,0.95); }
    .logo {
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }
    .logo i {
      width: 18px; height: 18px;
      background: linear-gradient(135deg, var(--accent), #c084fc);
      border-radius: 5px;
      display: grid;
      place-items: center;
      font-style: normal;
      font-size: 0.6rem;
      font-weight: 800;
    }
    .top-title { flex: 1; text-align: center; font-size: 0.78rem; color: var(--dim); }
    .top-right { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--dim); }
    .badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--elevated);
      color: var(--green);
      cursor: pointer;
    }
    .badge:hover { opacity: 0.8; }
    .icon-btn {
      background: none; border: none; color: var(--dim);
      width: 28px; height: 28px; border-radius: 6px;
      cursor: pointer; font-size: 0.9rem;
      display: grid; place-items: center;
      position: relative;
    }
    .icon-btn:hover { background: var(--elevated); color: var(--text); }
    .icon-btn .notif-dot {
      position: absolute; top: 2px; right: 2px;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--red);
      border: 1px solid var(--bg);
    }
    /* desktop */
    .desktop {
      position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(139,124,255,0.07), transparent 42%),
        radial-gradient(ellipse at 88% 82%, rgba(196,181,253,0.04), transparent 40%),
        var(--bg);
      transition: background 0.3s;
    }
    /* desktop widgets */
    .widgets {
      position: absolute; top: 14px; right: 16px;
      display: flex; flex-direction: column; gap: 8px;
      pointer-events: none;
      z-index: 5;
    }
    .widget {
      background: rgba(11,11,17,0.75);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      min-width: 120px;
      pointer-events: auto;
      font-size: 0.72rem;
      color: var(--dim);
    }
    .widget .val { color: var(--text); font-weight: 600; font-size: 0.85rem; }
    .widget .label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .icons {
      position: absolute; top: 14px; left: 10px;
      display: flex; flex-direction: column; gap: 2px;
      z-index: 5;
    }
    .desk-icon {
      width: 74px; text-align: center; cursor: pointer;
      padding: 9px 4px; border-radius: 10px;
      font-size: 0.66rem; color: var(--dim);
      transition: 0.15s;
    }
    .desk-icon:hover { background: rgba(255,255,255,0.06); color: var(--text); transform: scale(1.02); }
    .desk-icon:active { background: rgba(139,124,255,0.16); transform: scale(0.95); }
    .desk-icon b { display: block; font-size: 1.5rem; margin-bottom: 3px; font-weight: 400; }
    /* windows */
    .window {
      position: absolute; background: var(--panel);
      border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      min-width: 260px; min-height: 160px; overflow: hidden;
      transition: border-color 0.15s;
      backdrop-filter: blur(4px);
    }
    .window.focus { border-color: rgba(139,124,255,0.5); }
    .wbar {
      height: 34px; background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 10px; gap: 8px;
      cursor: move; font-size: 0.8rem; font-weight: 500;
      flex-shrink: 0;
      user-select: none;
    }
    .wctrls { margin-left: auto; display: flex; gap: 6px; }
    .wdot {
      width: 11px; height: 11px; border-radius: 50%; border: none; cursor: pointer;
      transition: 0.15s;
    }
    .wdot:hover { transform: scale(1.2); }
    .wdot.x { background: var(--red); }
    .wdot.m { background: var(--orange); }
    .wdot.f { background: var(--green); }
    .wbody { flex: 1; overflow: auto; position: relative; display: flex; flex-direction: column; }
    .resizer { position: absolute; z-index: 10; }
    .resizer.r { right: 0; top: 0; width: 6px; height: 100%; cursor: ew-resize; }
    .resizer.b { bottom: 0; left: 0; width: 100%; height: 6px; cursor: ns-resize; }
    .resizer.br { right: 0; bottom: 0; width: 16px; height: 16px; cursor: nwse-resize; }
    /* taskbar */
    .taskbar {
      background: rgba(11,11,17,0.97);
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 8px; gap: 4px; z-index: 90;
      backdrop-filter: blur(8px);
    }
    .theme-light .taskbar { background: rgba(232,232,239,0.97); }
    .start-btn {
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border: none; color: #fff;
      width: 34px; height: 30px; border-radius: 8px;
      font-weight: 700; cursor: pointer; flex-shrink: 0;
      transition: 0.15s;
    }
    .start-btn:hover { transform: scale(1.04); }
    .pins { display: flex; gap: 2px; padding: 0 6px; border-right: 1px solid var(--border); margin-right: 4px; }
    .pin {
      width: 34px; height: 30px; border: none; background: transparent;
      border-radius: 7px; cursor: pointer; font-size: 0.95rem;
      display: grid; place-items: center;
      transition: 0.15s;
    }
    .pin:hover { background: rgba(139,124,255,0.16); }
    .tasks { display: flex; gap: 3px; flex: 1; overflow-x: auto; }
    .task {
      background: var(--elevated); border: 1px solid transparent;
      color: var(--text); padding: 4px 10px; border-radius: 7px;
      font-size: 0.72rem; cursor: pointer; white-space: nowrap;
      transition: 0.15s;
    }
    .task:hover, .task.on { border-color: var(--border); background: rgba(139,124,255,0.12); }
    .clock { font-size: 0.72rem; color: var(--dim); padding: 0 8px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    /* start menu */
    .start-menu {
      position: absolute; bottom: 54px; left: 8px;
      width: 340px; background: rgba(18,18,25,0.96);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 10px; display: none; z-index: 2000;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .start-menu.open { display: block; }
    .start-menu-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 2px 2px 10px; border-bottom: 1px solid rgba(255,255,255,0.04); margin-bottom: 8px;
    }
    .eyebrow { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--dim); margin-bottom: 2px; }
    .start-title { font-size: 0.82rem; font-weight: 600; color: var(--text); }
    .start-clock { font-size: 0.72rem; color: var(--accent2); background: rgba(139,124,255,0.12); border: 1px solid rgba(139,124,255,0.2); border-radius: 999px; padding: 4px 7px; font-variant-numeric: tabular-nums; }
    .start-menu input { width: 100%; background: var(--elevated); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; color: var(--text); outline: none; font-size: 0.8rem; margin-bottom: 8px; }
    .start-quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
    .quick-item { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-radius: 9px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); color: var(--text); text-align: left; cursor: pointer; font-size: 0.72rem; transition: 0.15s; }
    .quick-item:hover { background: rgba(139,124,255,0.09); border-color: rgba(139,124,255,0.32); }
    .quick-item b { font-size: 1rem; }
    .sgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; max-height: 300px; overflow-y: auto; }
    .sitem { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 10px 6px; border-radius: 9px; cursor: pointer; font-size: 0.72rem; color: var(--dim); text-align: center; transition: 0.15s; }
    .sitem:hover { background: var(--elevated); color: var(--text); }
    .sitem b { font-size: 1.3rem; font-weight: 400; }
    /* context */
    .ctx {
      position: fixed; background: var(--panel);
      border: 1px solid var(--border); border-radius: 9px;
      padding: 5px; min-width: 170px; z-index: 2500;
      display: none; box-shadow: var(--shadow);
    }
    .ctx.open { display: block; }
    .ctx button {
      display: block; width: 100%; text-align: left;
      background: none; border: none; color: var(--text);
      padding: 7px 11px; border-radius: 5px; font-size: 0.8rem; cursor: pointer;
      transition: 0.1s;
    }
    .ctx button:hover { background: var(--elevated); }
    /* notification center */
    .notif-center {
      position: fixed; top: 44px; right: 10px;
      width: 320px; max-height: 400px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      z-index: 3000;
      display: none;
      overflow: hidden;
      backdrop-filter: blur(12px);
    }
    .notif-center.open { display: block; }
    .notif-center .head {
      padding: 10px 14px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.8rem; font-weight: 600;
    }
    .notif-center .head button { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 0.7rem; }
    .notif-center .head button:hover { color: var(--text); }
    .notif-list { overflow-y: auto; max-height: 340px; padding: 6px; }
    .notif-item {
      padding: 8px 10px; border-radius: 8px; margin-bottom: 4px;
      font-size: 0.78rem; border-left: 3px solid var(--accent);
      background: var(--elevated);
    }
    .notif-item .time { font-size: 0.6rem; color: var(--dim); float: right; }
    .notif-item.info { border-left-color: var(--accent); }
    .notif-item.warn { border-left-color: var(--orange); }
    .notif-item.error { border-left-color: var(--red); }
    .notif-item.success { border-left-color: var(--green); }
    .toast {
      position: fixed; bottom: 58px; right: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 13px;
      font-size: 0.8rem; z-index: 3000;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    /* app styles */
    .term { background: #08080e; color: #b5e0b5; font-family: var(--mono); font-size: 0.78rem; padding: 10px; height: calc(100% - 36px); overflow-y: auto; white-space: pre-wrap; }
    .term-in { height: 36px; background: #08080e; border-top: 1px solid #1a1a24; display: flex; align-items: center; padding: 0 8px; gap: 6px; }
    .term-in input { flex: 1; background: transparent; border: none; color: #b5e0b5; font-family: var(--mono); font-size: 0.78rem; outline: none; }
    .editor { display: flex; flex-direction: column; height: 100%; }
    .ebar { padding: 5px 8px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; gap: 5px; flex-shrink: 0; flex-wrap: wrap; align-items: center; }
    .ebar .tabs { display: flex; gap: 3px; flex: 1; overflow-x: auto; }
    .ebar .tab { padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; background: var(--elevated); border: 1px solid var(--border); white-space: nowrap; }
    .ebar .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .editor textarea { flex: 1; width: 100%; background: #0a0a10; color: var(--text); border: none; padding: 10px; font-family: var(--mono); font-size: 0.8rem; resize: none; outline: none; line-height: 1.45; }
    .estat { padding: 3px 8px; background: var(--surface); border-top: 1px solid var(--border); font-size: 0.68rem; color: var(--dim); display: flex; justify-content: space-between; flex-shrink: 0; }
    .chat { display: flex; flex-direction: column; height: 100%; }
    .msgs { flex: 1; overflow-y: auto; padding: 12px; }
    .bubble { max-width: 88%; padding: 7px 11px; border-radius: 9px; margin-bottom: 8px; font-size: 0.82rem; line-height: 1.4; word-wrap: break-word; }
    .bubble.user { background: rgba(139,124,255,0.18); margin-left: auto; }
    .bubble.bot { background: var(--elevated); }
    .chat-in { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--border); flex-shrink: 0; }
    .chat-in input { flex: 1; background: var(--elevated); border: 1px solid var(--border); border-radius: 7px; padding: 7px 10px; color: var(--text); outline: none; font-size: 0.82rem; }
    .docs { display: flex; height: 100%; }
    .dnav { width: 120px; background: var(--surface); border-right: 1px solid var(--border); padding: 6px 0; overflow-y: auto; flex-shrink: 0; }
    .ditem { padding: 7px 10px; font-size: 0.78rem; cursor: pointer; color: var(--dim); }
    .ditem:hover, .ditem.on { background: var(--elevated); color: var(--accent2); }
    .dbody { flex: 1; padding: 14px 16px; overflow-y: auto; font-size: 0.85rem; line-height: 1.5; }
    .dbody h2 { font-size: 1.05rem; margin-bottom: 6px; }
    .dbody pre { background: #0a0a10; padding: 8px; border-radius: 7px; font-family: var(--mono); font-size: 0.75rem; margin: 6px 0; white-space: pre-wrap; overflow-x: auto; }
    .dbody ul { margin: 4px 0 4px 16px; }
    .list { padding: 10px; overflow-y: auto; }
    .card { background: var(--elevated); border: 1px solid var(--border); border-radius: 9px; padding: 10px; margin-bottom: 6px; cursor: pointer; transition: 0.15s; }
    .card:hover { border-color: var(--accent); transform: translateX(2px); }
    .card h4 { font-size: 0.82rem; margin-bottom: 2px; }
    .card p { font-size: 0.72rem; color: var(--dim); }
    .files { padding: 10px; display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; overflow-y: auto; }
    .file { background: var(--elevated); border: 1px solid var(--border); border-radius: 9px; padding: 10px 4px; text-align: center; cursor: pointer; font-size: 0.7rem; transition: 0.15s; }
    .file:hover { border-color: var(--accent); transform: scale(1.02); }
    .notes { width: 100%; height: 100%; background: #0c0c12; border: none; color: var(--text); padding: 12px; font-size: 0.88rem; resize: none; outline: none; line-height: 1.45; }
    .pad { padding: 14px; font-size: 0.88rem; line-height: 1.5; overflow-y: auto; }
    .pad label { display: block; margin: 10px 0 3px; font-size: 0.75rem; color: var(--dim); }
    .pad input, .pad select { width: 100%; background: var(--elevated); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; color: var(--text); outline: none; }
    .pad textarea { width: 100%; background: var(--elevated); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; color: var(--text); outline: none; font-family: var(--mono); font-size: 0.78rem; resize: vertical; }
    .mono-block { padding: 12px; font-family: var(--mono); font-size: 0.78rem; line-height: 1.55; white-space: pre-wrap; overflow-y: auto; }
    .vhw { padding: 12px; display: grid; gap: 8px; overflow-y: auto; }
    .vh { background: var(--elevated); border: 1px solid var(--border); border-radius: 9px; padding: 10px; }
    .vh h4 { font-size: 0.75rem; color: var(--accent2); margin-bottom: 4px; }
    .bar { height: 5px; background: #0a0a10; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.3s; }
    .net { padding: 12px; font-size: 0.82rem; overflow-y: auto; }
    .net h3 { font-size: 0.78rem; color: var(--accent2); margin: 10px 0 6px; display: flex; align-items: center; justify-content: space-between; }
    .net h3:first-child { margin-top: 0; }
    .nrow { display: flex; align-items: center; gap: 6px; padding: 7px 9px; background: var(--elevated); border: 1px solid var(--border); border-radius: 7px; margin-bottom: 4px; cursor: pointer; font-size: 0.8rem; transition: 0.15s; }
    .nrow:hover { border-color: var(--accent); }
    .nrow.on { border-color: var(--green); background: rgba(52,211,153,0.08); }
    .nrow .r { margin-left: auto; font-size: 0.7rem; color: var(--dim); }
    .meta { font-family: var(--mono); font-size: 0.7rem; color: var(--dim); margin: 4px 0 6px; line-height: 1.45; }
    .row-btns { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .toggle {
      width: 34px; height: 18px; border-radius: 9px;
      background: var(--border); border: none; cursor: pointer;
      position: relative; flex-shrink: 0;
      transition: 0.15s;
    }
    .toggle.on { background: var(--green); }
    .toggle::after {
      content: ""; position: absolute;
      width: 12px; height: 12px; border-radius: 50%;
      background: #fff; top: 3px; left: 3px;
      transition: left 0.12s;
    }
    .toggle.on::after { left: 19px; }
    .pixel { padding: 10px; font-family: var(--mono); font-size: 0.75rem; overflow-y: auto; }
    .pixel .pix-item { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .pixel .pix-item .label { color: var(--dim); }
    .pixel .pix-item .val { color: var(--accent2); }
    .sysmon { padding: 10px; display: flex; flex-direction: column; height: 100%; }
    .sysmon canvas { width: 100%; flex: 1; background: #0a0a10; border-radius: 6px; }
    .sysmon .stats { display: flex; gap: 12px; padding: 6px 0; font-size: 0.75rem; color: var(--dim); flex-shrink: 0; flex-wrap: wrap; }
    .sysmon .stats span { color: var(--text); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    .log-info { color: var(--accent2); }
    .log-warn { color: var(--orange); }
    .log-error { color: var(--red); }
    .playground { display: flex; flex-direction: column; height: 100%; }
    .playground .p-top { display: flex; gap: 6px; padding: 6px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; align-items: center; }
    .playground .p-top select { background: var(--elevated); border: 1px solid var(--border); color: var(--text); padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; }
    .playground .p-body { flex: 1; display: flex; flex-direction: column; }
    .playground .p-body textarea { flex: 1; width: 100%; background: #0a0a10; color: var(--text); border: none; padding: 10px; font-family: var(--mono); font-size: 0.8rem; resize: none; outline: none; line-height: 1.45; }
    .playground .p-output { background: #0a0a10; border-top: 1px solid var(--border); padding: 8px; font-family: var(--mono); font-size: 0.75rem; white-space: pre-wrap; max-height: 150px; overflow-y: auto; }
    /* auto dash */
    .auto-dash { padding: 12px; display: flex; flex-direction: column; gap: 10px; height: 100%; overflow-y: auto; }
    .auto-rule { background: var(--elevated); border: 1px solid var(--border); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
    .auto-rule .header { display: flex; justify-content: space-between; align-items: center; }
    .auto-rule .header .name { font-weight: 600; font-size: 0.85rem; }
    .auto-rule .header .status { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; }
    .auto-rule .header .status.on { background: var(--green); color: #000; }
    .auto-rule .header .status.off { background: var(--dim); color: #000; }
    .auto-rule .details { font-size: 0.72rem; color: var(--dim); display: flex; gap: 12px; flex-wrap: wrap; }
    .auto-rule .actions { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }

// ===================================================================
//  EVENT BUS
// ===================================================================
const EventBus = {
  listeners: new Map(),
  emit(name, data) {
    const list = this.listeners.get(name) || [];
    list.forEach(fn => fn(data));
    triggerAutomationEvent(name, data);
  },
  on(name, fn) {
    if (!this.listeners.has(name)) this.listeners.set(name, []);
    this.listeners.get(name).push(fn);
  },
  off(name, fn) {
    const list = this.listeners.get(name);
    if (list) { const idx = list.indexOf(fn); if (idx > -1) list.splice(idx, 1); }
  }
};
window.EventBus = EventBus;

function addNotification(msg, type = 'info', title = '') {
  const id = ++S.notifId;
  S.notifications.push({ id, msg, type, title, time: Date.now() });
  if (S.notifications.length > 50) S.notifications.shift();
  renderNotifs();
  document.getElementById('notifDot').style.display = 'block';
  // toast for immediate visibility
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = (title ? title + ': ' : '') + msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
  return id;
}

function renderNotifs() {

  `).join('');
  document.getElementById('notifDot').style.display = S.notifications.length ? 'block' : 'none';
}

function clearNotifs() {

async function updateHardware() {
  S.hardware.cpu.load = Math.min(100, Math.max(0, S.hardware.cpu.load + (Math.random()-0.5)*6));
  S.hardware.cpu.temp = 30 + S.hardware.cpu.load * 0.25 + Math.random()*2;
  if (performance.memory) {
    const mem = performance.memory;
    S.hardware.ram.used = mem.usedJSHeapSize / (1024**3);
    S.hardware.ram.total = mem.jsHeapSizeLimit / (1024**3);
    S.hardware.ram.free = S.hardware.ram.total - S.hardware.ram.used;
  } else {
    S.hardware.ram.used = Math.min(S.hardware.ram.total, Math.max(0, S.hardware.ram.used + (Math.random()-0.5)*0.2));
    S.hardware.ram.free = S.hardware.ram.total - S.hardware.ram.used;
  }
  try {
    const battery = await navigator.getBattery();
    S.hardware.battery.level = battery.level * 100;
    S.hardware.battery.charging = battery.charging;
  } catch(e) {}
  try {
    const estimate = await navigator.storage.estimate();
    S.hardware.storage.total = estimate.quota / (1024**3);
    S.hardware.storage.used = estimate.usage / (1024**3);
    S.hardware.storage.free = S.hardware.storage.total - S.hardware.storage.used;
  } catch(e) {}
  if (navigator.connection) {
    const conn = navigator.connection;
    S.net.signal = conn.downlink ? Math.min(100, conn.downlink * 10) : 70;
    S.net.rtt = conn.rtt || 20;
    S.net.bandwidthHistory.push({ time: Date.now(), downlink: conn.downlink || 10, rtt: conn.rtt || 20 });
    if (S.net.bandwidthHistory.length > 60) S.net.bandwidthHistory.shift();

  });

    p.cpu = Math.min(100, Math.max(0, p.cpu + (Math.random()-0.5)*2));
    p.mem = Math.min(256, Math.max(2, p.mem + (Math.random()-0.5)*0.5));

  updateBTBadge();

}

// ===================================================================
//  VFS – File System
// ===================================================================
async function mountRealFolder() {
  try {
    const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    const name = dirHandle.name;
    const mount = { name, type: 'folder', handle: dirHandle, rootPath: '/' + name, entries: new Map() };
    S.mounts = S.mounts || [];
    S.mounts.push(mount);
    log(`Mounted folder: ${name}`, 'INFO');
    toast(`Mounted ${name}`);
    EventBus.emit('folder:mounted', { name });
    if (window._refreshFiles) window._refreshFiles();
    return mount;
  } catch (e) {
    if (e.name !== 'AbortError') { log('Mount failed: '+e.message, 'ERROR'); toast('Mount failed: '+e.message); }
  }
}

function resolvePath(path) {
  S.mounts = S.mounts || [];
  if (path.startsWith('/')) {
    for (const mount of S.mounts) {
      if (path === mount.rootPath || path.startsWith(mount.rootPath + '/')) {
        const rel = path.slice(mount.rootPath.length);
        return { mount, rel: rel || '/' };
      }
    }
    return { mount: null, rel: path };
  } else { return { mount: null, rel: path }; }
}

async function vfsRead(path) {
  const { mount, rel } = resolvePath(path);
  if (mount && mount.type === 'folder') {
    try {
      const parts = rel.split('/').filter(Boolean);
      let current = mount.handle;
      for (let i=0; i<parts.length-1; i++) current = await current.getDirectoryHandle(parts[i]);
      const fileHandle = await current.getFileHandle(parts[parts.length-1]);
      const file = await fileHandle.getFile();
      return await file.text();
    } catch (e) { return null; }
  } else {
    const entry = S.fs.get(path);
    return entry ? entry.content : null;
  }
}

async function vfsWrite(path, content) {
  const { mount, rel } = resolvePath(path);
  if (mount && mount.type === 'folder') {
    try {
      const parts = rel.split('/').filter(Boolean);
      let current = mount.handle;
      for (let i=0; i<parts.length-1; i++) current = await current.getDirectoryHandle(parts[i], { create: true });
      const fileHandle = await current.getFileHandle(parts[parts.length-1], { create: true });
      const writable = await fileHandle.createWritable();
      await writable.write(content);
      await writable.close();
      log(`Written to real folder: ${path}`, 'INFO');
      EventBus.emit('file:changed', { path, content });
      return true;
    } catch (e) { log(`Write failed: ${e.message}`, 'ERROR'); return false; }
  } else {
    S.fs.set(path, { content, size: content.length, perms: 'rw-', mtime: Date.now() });
    saveState();
    EventBus.emit('file:changed', { path, content });
    return true;
  }
}

function searchFiles(query) {
  const q = String(query || '').toLowerCase().trim();
  if (!q) return [];
  const results = [];
  for (const [path, entry] of S.fs) {
    if (path.toLowerCase().includes(q) || (entry.content && entry.content.toLowerCase().includes(q))) {
      results.push({ path, preview: (entry.content || '').slice(0, 80), size: entry.size });
    }
  }
  return results;
}
window.searchFiles = searchFiles;

async function scanBluetooth() {
  if (!navigator.bluetooth) { toast('Bluetooth not supported'); return; }
  try {
    S.bluetooth.scanning = true;
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['generic_access']
    });
    S.bluetooth.device = device;
    S.bluetooth.discovered.push(device);
    log(`Bluetooth device: ${device.name || 'unknown'}`, 'INFO');
    toast(`Connected to ${device.name || 'device'}`);
    updateBTBadge();
    EventBus.emit('bluetooth:connected', { name: device.name, id: device.id });
    try {
      const server = await device.gatt.connect();
      const services = await server.getPrimaryServices();
      S.bluetooth.services = services;
    } catch(e) {}
  } catch (e) {
    if (e.name !== 'NotFoundError') { log('Bluetooth error: '+e.message, 'ERROR'); toast('Bluetooth error: '+e.message); }
  }
  S.bluetooth.scanning = false;
}

function saveState() {
  try {
    localStorage.setItem('aether-ultimate-v2', JSON.stringify({
      fs: Array.from(S.fs.entries()),
      knowledge: S.knowledge,
      notes: S.notes,
      pixel: Array.from(S.pixel.entries()),
      net: S.net,
      settings: S.settings,
      processes: S.processes,
      modules: S.modules,
      disk: S.disk,
      vhw: S.vhw,
      logs: S.logs.slice(-50),
      automations: S.automations,
      automationLogs: S.automationLogs.slice(-100),
      notifications: S.notifications.slice(-30),
      theme: S.theme
    }));
  } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem('aether-ultimate-v2');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.fs) S.fs = new Map(d.fs);
    if (d.knowledge) S.knowledge = d.knowledge;
    if (typeof d.notes === 'string') S.notes = d.notes;
    if (d.pixel) S.pixel = new Map(d.pixel);
    if (d.net) S.net = d.net;
    if (d.settings) S.settings = d.settings;
    if (d.processes) S.processes = d.processes;
    if (d.modules) S.modules = d.modules;
    if (d.disk) S.disk = d.disk;
    if (d.vhw) S.vhw = d.vhw;
    if (d.logs) S.logs = d.logs;
    if (d.automations) S.automations = d.automations;
    if (d.automationLogs) S.automationLogs = d.automationLogs;
    if (d.notifications) S.notifications = d.notifications;
    if (d.theme) S.theme = d.theme;
  } catch(e) {}
}
function seed() {
  if (S.fs.size === 0) {
    const def = {
      '/readme.txt': 'Æther OS Ultimate · Automation, real folders, Bluetooth, VHW, Pixels.',
      '/hello.js': 'return "Hello from Æther";',

      '/omega/hello.ae': 'let name = "Æther"\nfn greet(w) { return "Hello, " + w }\nprint(greet(name))',
      '/net/profile.json': '{"ssid":"Æther-Link","mode":"light-speed"}'
    };
    Object.entries(def).forEach(([path, content]) => {
      S.fs.set(path, { content, size: content.length, perms: 'rw-', mtime: Date.now() });
    });
  }
  if (!S.knowledge.length) {
    S.knowledge = [
      { topic: 'aether', fact: 'Ultimate OS with Automation Engine, real folders, Bluetooth, and more.' },
      { topic: 'automation', fact: 'Automation Engine: triggers, actions, scheduler, event bus, scripts.' },
      { topic: 'bluetooth', fact: 'Web Bluetooth API for real device discovery and connection.' },
      { topic: 'folder', fact: 'Mount any folder from your computer using File System Access API.' }
    ];
  }
  if (!S.pixel.size) S.pixel.set('px1', { type: 'app', label: 'Hello', data: 'Desktop' });
  if (!S.automations || !S.automations.length) {
    S.automations = [
      {
        id: 'auto1',
        name: 'Welcome Toast',
        enabled: true,
        trigger: { type: 'startup' },
        action: { type: 'sendToast', params: { message: 'Welcome to Æther OS Ultimate!' } },
        lastRun: null, nextRun: null, schedule: null, createdAt: Date.now()
      },
      {
        id: 'auto2',
        name: 'Daily Note',
        enabled: true,
        trigger: { type: 'time', params: { hour: 9, minute: 0 } },
        action: { type: 'runScript', params: { script: `// Daily note\nconst date = new Date().toLocaleDateString();\nvfsWrite('/daily-'+date+'.txt', 'Log for '+date);\ntoast('Daily note created');` } },
        lastRun: null, nextRun: null,
        schedule: { type: 'daily', hour: 9, minute: 0 },
        createdAt: Date.now()
      }
    ];
  }
}
loadState();
seed();

//  WINDOW MANAGER
// ===================================================================
let drag = null;

function createWin(app, title, w, h, html) {
  const id = app + '-' + (S.id++);
  const el = document.createElement('div');
  el.className = 'window focus';
  el.dataset.id = id;
  el.dataset.app = app;
  el.style.cssText = `width:${w}px;height:${h}px;left:${45+Math.random()*50}px;top:${32+Math.random()*28}px;z-index:${++S.z}`;
  el.innerHTML = `
    <div class="wbar"><span>${title}</span><div class="wctrls">
      <button class="wdot m" title="Min"></button>
      <button class="wdot f" title="Max"></button>
      <button class="wdot x" title="Close"></button>
    </div></div>
    <div class="wbody">${html}</div>
  `;
  const bar = el.querySelector('.wbar');
  bar.onmousedown = (e) => {
    if (e.target.classList.contains('wdot')) return;
    drag = { el, ox: e.clientX - el.offsetLeft, oy: e.clientY - el.offsetTop };
    focus(id);
  };
  bar.ondblclick = () => el.querySelector('.f').click();
  el.querySelector('.x').onclick = () => close(id);
  el.querySelector('.m').onclick = () => { el.style.display = 'none'; tasks(); };
  el.querySelector('.f').onclick = () => {
    if (el.dataset.max) {
      el.style.left = el.dataset.lx + 'px';
      el.style.top = el.dataset.ly + 'px';
      el.style.width = el.dataset.lw + 'px';
      el.style.height = el.dataset.lh + 'px';
      delete el.dataset.max;
    } else {
      el.dataset.lx = el.offsetLeft;
      el.dataset.ly = el.offsetTop;
      el.dataset.lw = el.offsetWidth;
      el.dataset.lh = el.offsetHeight;
      el.style.left = el.style.top = '0';
      el.style.width = el.style.height = '100%';
      el.dataset.max = '1';
    }
  };
  el.onmousedown = () => focus(id);
  ['r','b','br'].forEach(dir => {
    const res = document.createElement('div');
    res.className = 'resizer ' + dir;
    res.onmousedown = (e) => {
      e.stopPropagation();
      const startX = e.clientX, startY = e.clientY;
      const startW = el.offsetWidth, startH = el.offsetHeight;
      const onMove = (ev) => {
        if (dir.includes('r')) el.style.width = Math.max(200, startW + ev.clientX - startX) + 'px';
        if (dir.includes('b')) el.style.height = Math.max(150, startH + ev.clientY - startY) + 'px';
      };
      const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    };
    el.appendChild(res);
  });
  document.getElementById('desktop').appendChild(el);
  S.wins.set(id, el);
  focus(id);
  tasks();
  document.getElementById('title').textContent = title;
  log(`Window opened: ${title}`, 'INFO');
  EventBus.emit('app:opened', { app, title, id });
  addNotification(`Opened ${title}`, 'info', 'Window');
  return { id, el };
}

function focus(id) {
  S.wins.forEach((w, k) => {
    w.classList.toggle('focus', k === id);
    if (k === id) {
      w.style.display = 'flex';
      w.style.zIndex = ++S.z;
      const t = w.querySelector('.wbar span');
      if (t) document.getElementById('title').textContent = t.textContent;
    }
  });
  tasks();
}
function close(id) {
  const w = S.wins.get(id);
  if (!w) return;
  const title = w.querySelector('.wbar span').textContent;
  const app = w.dataset.app;
  w.remove();
  S.wins.delete(id);
  tasks();
  if (!S.wins.size) document.getElementById('title').textContent = 'Desktop';
  log(`Window closed: ${title}`, 'INFO');
  EventBus.emit('app:closed', { app, title, id });
}

document.onmousemove = (e) => {
  if (!drag) return;
  drag.el.style.left = Math.max(0, e.clientX - drag.ox) + 'px';
  drag.el.style.top = Math.max(0, e.clientY - drag.oy) + 'px';
};
document.onmouseup = () => { drag = null; };

function tasks() {
  const bar = document.getElementById('tasks');
  bar.innerHTML = '';
  const seen = {};
  S.wins.forEach((w, id) => {
    const app = w.dataset.app;
    if (seen[app]) return;
    seen[app] = true;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'task' + (w.style.display !== 'none' ? ' on' : '');
    b.textContent = w.querySelector('.wbar span').textContent;
    b.onclick = () => {
      if (w.style.display === 'none') w.style.display = 'flex';
      focus(id);
    };
    bar.appendChild(b);
  });
}

function updateClock() {
  const now = new Date();
  const label = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const top = document.getElementById('tclock');
  const bottom = document.getElementById('bclock');
  const start = document.getElementById('start-clock');
  if (top) top.textContent = label;
  if (bottom) bottom.textContent = label;
  if (start) start.textContent = label;
  updateStartMeta();
}

function updateStartMeta() {
  const el = document.querySelector('.start-title');
  if (!el) return;
  const now = new Date();
  const hour = now.getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  el.textContent = `${greeting} · ${S.automations.length} automations`;
}

function focusNextWindow() {
  const openWins = [...S.wins.values()].filter(w => w.style.display !== 'none');
  if (!openWins.length) return;
  const active = document.querySelector('.window.focus');
  const currentIndex = openWins.indexOf(active);
  const next = openWins[(currentIndex + 1) % openWins.length] || openWins[0];
  if (next && next.dataset.id) focus(Number(next.dataset.id));
}

function toggleStart() {
  const m = document.getElementById('start');
  m.classList.toggle('open');
  if (m.classList.contains('open')) {
    buildStart('');
    document.getElementById('sfilter').value = '';
    document.getElementById('sfilter').focus();
  }
}

document.onclick = (e) => {
  const start = document.getElementById('start');
  const ctx = document.getElementById('ctx');
  if (!start.contains(e.target) && !e.target.classList.contains('start-btn') && !e.target.closest('.logo')) start.classList.remove('open');
  if (!ctx.contains(e.target)) ctx.classList.remove('open');
};
document.onkeydown = (e) => {
  const target = e.target;
  const isTextInput = target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable);
  if ((e.ctrlKey || e.metaKey) && e.key === ' ') {
    e.preventDefault(); toggleStart(); return;
  }
  if ((e.altKey || e.metaKey) && e.key === 'Tab') {
    e.preventDefault(); focusNextWindow(); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 't') {
    e.preventDefault(); open('terminal'); return;
  }
  if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === 'n') {
    e.preventDefault(); open('notes'); return;
  }
  if (e.key === 'Escape') {
    document.getElementById('start').classList.remove('open');
    document.getElementById('ctx').classList.remove('open');
    document.getElementById('notifCenter').classList.remove('open');
  }
  if (isTextInput) return;
  if (e.key.toLowerCase() === 't') open('terminal');
  if (e.key.toLowerCase() === 'n') open('notes');
};

setInterval(updateClock, 1000);
updateClock();

document.getElementById('desktop').oncontextmenu = (e) => {
  if (e.target.closest('.window') || e.target.closest('.desk-icon')) return;
  e.preventDefault();
  const ctx = document.getElementById('ctx');
  ctx.style.left = e.clientX + 'px';

// ===================================================================
//  AUTOMATION ENGINE
// ===================================================================
function generateId() { return 'auto-' + Date.now() + '-' + Math.random().toString(36).slice(2,6); }

function addAutomation(name, trigger, action, schedule) {
  const rule = {
    id: generateId(),
    name: name || 'Unnamed',
    enabled: true,
    trigger: trigger,
    action: action,
    schedule: schedule || null,
    lastRun: null,
    nextRun: null,
    createdAt: Date.now()
  };
  S.automations.push(rule);
  saveState();
  log(`Automation created: ${name}`, 'INFO');
  EventBus.emit('automation:created', { id: rule.id, name });
  return rule;
}

function deleteAutomation(id) {
  const idx = S.automations.findIndex(r => r.id === id);
  if (idx > -1) {
    const name = S.automations[idx].name;
    S.automations.splice(idx, 1);
    saveState();
    log(`Automation deleted: ${name}`, 'INFO');
    EventBus.emit('automation:deleted', { id, name });
    return true;
  }
  return false;
}

function toggleAutomation(id) {
  const rule = S.automations.find(r => r.id === id);
  if (rule) {
    rule.enabled = !rule.enabled;
    saveState();
    log(`Automation ${rule.enabled ? 'enabled' : 'disabled'}: ${rule.name}`, 'INFO');
    EventBus.emit('automation:toggled', { id, enabled: rule.enabled });
    return rule.enabled;
  }
  return false;
}

function runAutomation(id) {
  const rule = S.automations.find(r => r.id === id);
  if (!rule || !rule.enabled) return false;
  return executeAutomation(rule);
}

function executeAutomation(rule) {
  try {
    const action = rule.action;
    const result = executeAction(action);
    rule.lastRun = Date.now();
    if (rule.schedule) rule.nextRun = calculateNextRun(rule.schedule);
    saveState();
    S.automationLogs.push({ time: Date.now(), ruleId: rule.id, msg: `Executed: ${rule.name}`, ok: true });
    if (S.automationLogs.length > 100) S.automationLogs.shift();
    EventBus.emit('automation:executed', { id: rule.id, name: rule.name, result });
    return result;
  } catch (e) {
    S.automationLogs.push({ time: Date.now(), ruleId: rule.id, msg: `Error in ${rule.name}: ${e.message}`, ok: false });
    if (S.automationLogs.length > 100) S.automationLogs.shift();
    EventBus.emit('automation:error', { id: rule.id, name: rule.name, error: e.message });
    log(`Automation error: ${rule.name} – ${e.message}`, 'ERROR');
    return null;
  }
}

async function executeAction(action) {
  const type = action.type;
  const p = action.params || {};
  switch (type) {
    case 'openApp':
      if (p.appId && typeof open === 'function') { open(p.appId); return { ok: true, app: p.appId }; }
      return { ok: false, error: 'Invalid app ID' };
    case 'closeApp': {
      let closed = 0;
      S.wins.forEach((w, id) => { if (!p.appId || w.dataset.app === p.appId) { close(id); closed++; } });
      return { ok: true, closed };
    }
    case 'sendToast': toast(p.message || 'Automation toast'); return { ok: true, message: p.message };
    case 'sendLog': log(p.message || 'Automation log', p.level || 'INFO'); return { ok: true, message: p.message };
    case 'addNotification':
      addNotification(p.message || 'Automation notification', p.type || 'info', p.title || '');
      return { ok: true, message: p.message };
    case 'runScript': {
      const context = { S, vfsRead, vfsWrite, toast, log, open, EventBus, emitEvent: (n,d) => EventBus.emit(n,d),
        console: { log: (...a) => S.automationLogs.push({ time: Date.now(), ruleId: 'script', msg: a.join(' '), ok: true }),
          error: (...a) => S.automationLogs.push({ time: Date.now(), ruleId: 'script', msg: 'ERROR: '+a.join(' '), ok: false }) } };
      const fn = new Function('S','vfsRead','vfsWrite','toast','log','open','EventBus','emitEvent','console',`"use strict";\n${p.script||''}`);
      const result = fn(context.S, context.vfsRead, context.vfsWrite, context.toast, context.log, context.open, context.EventBus, context.emitEvent, context.console);
      return { ok: true, result };
    }
    case 'runPython': {
      if (!window.pyodideReady) await loadPyodide();
      if (!window.pyodide) return { ok: false, error: 'Pyodide not loaded' };
      try {
        const result = await window.pyodide.runPythonAsync(p.script || '');
        return { ok: true, result: String(result) };
      } catch (e) { return { ok: false, error: e.message }; }
    }
    case 'writeFile': { const path = p.path || '/auto.txt'; await vfsWrite(path, p.content || ''); return { ok: true, path, content: p.content }; }
    case 'readFile': { const path = p.path || '/auto.txt'; const content = await vfsRead(path); return { ok: true, path, content }; }
    case 'bluetoothScan': await scanBluetooth(); return { ok: true };
    case 'wifiToggle': S.net.wifi = !S.net.wifi; saveState(); updateBadge(); return { ok: true, state: S.net.wifi };
    case 'hotspotToggle': S.net.hotspot = !S.net.hotspot; saveState(); updateBadge(); return { ok: true, state: S.net.hotspot };
    case 'mountFolder': await mountRealFolder(); return { ok: true };
    case 'systemCommand': {
      const cmd = p.command || 'echo "Hello"';
      let output = '';
      if (cmd.startsWith('echo ')) output = cmd.slice(5);
      else if (cmd === 'date') output = new Date().toString();
      else if (cmd === 'uptime') { const up = (Date.now() - S.boot) / 1000 | 0; output = `${up}s`; }
      else output = `[simulated] ${cmd}`;
      toast('Command: ' + cmd);
      return { ok: true, output };
    }
    case 'httpRequest': {
      const url = p.url || '';
      try {
        const res = await fetch(url, { method: p.method || 'GET', headers: p.headers || {} });
        const data = await res.text();
        return { ok: true, status: res.status, data: data.slice(0, 200) };
      } catch (e) { return { ok: false, error: e.message }; }
    }
    case 'customEvent': { const evt = p.event || 'custom'; EventBus.emit(evt, p.data || {}); return { ok: true, event: evt, data: p.data }; }
    default: return { ok: false, error: `Unknown action type: ${type}` };
  }
}

function checkScheduledAutomations() {
  const now = Date.now();
  S.automations.forEach(rule => {
    if (!rule.enabled) return;
    if (rule.schedule && rule.nextRun && now >= rule.nextRun) {
      executeAutomation(rule);
      rule.nextRun = calculateNextRun(rule.schedule);
      saveState();
    }
  });
}

function calculateNextRun(schedule) {
  const now = new Date();
  if (!schedule) return null;
  if (schedule.type === 'interval') {
    const ms = (schedule.seconds||0)*1000 + (schedule.minutes||0)*60000 + (schedule.hours||0)*3600000;
    return now.getTime() + ms;
  }
  if (schedule.type === 'daily') {
    const h = schedule.hour||0, m = schedule.minute||0;
    const next = new Date(now); next.setHours(h, m, 0, 0);
    if (next <= now) next.setDate(next.getDate() + 1);
    return next.getTime();
  }
  if (schedule.type === 'weekly') {
    const day = schedule.day||0, h = schedule.hour||0, m = schedule.minute||0;
    const next = new Date(now); next.setHours(h, m, 0, 0);
    const currentDay = next.getDay();
    let diff = day - currentDay;
    if (diff < 0 || (diff === 0 && next <= now)) diff += 7;
    next.setDate(next.getDate() + diff);
    return next.getTime();
  }
  return null;
}

function triggerAutomationEvent(eventName, data) {
  S.automations.forEach(rule => {
    if (!rule.enabled) return;
    const trigger = rule.trigger;
    if (trigger.type === 'event' && trigger.params && trigger.params.event === eventName) executeAutomation(rule);
    if (trigger.type === 'fileChange' && eventName === 'file:changed') {
      const path = data?.path || '';
      const match = trigger.params?.path || '';
      if (!match || path.includes(match) || match === '*') executeAutomation(rule);
    }
    if (trigger.type === 'appOpen' && eventName === 'app:opened') {
      const appId = data?.app || '';
      const match = trigger.params?.appId || '';
      if (!match || appId === match || match === '*') executeAutomation(rule);
    }
    if (trigger.type === 'appClose' && eventName === 'app:closed') {
      const appId = data?.app || '';
      const match = trigger.params?.appId || '';
      if (!match || appId === match || match === '*') executeAutomation(rule);
    }
    if (trigger.type === 'networkChange' && (eventName === 'network:scan' || eventName === 'network:changed')) executeAutomation(rule);
    if (trigger.type === 'bluetoothConnect' && eventName === 'bluetooth:connected') executeAutomation(rule);
  });
}

let pyodideReady = false;
let pyodide = null;
async function loadPyodide() {
  if (pyodideReady) return;
  try {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.1/full/pyodide.js';
    document.head.appendChild(script);
    await new Promise((res,rej) => { script.onload = res; script.onerror = rej; });
    pyodide = await globalThis.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.1/full/' });
    pyodideReady = true;
    window.pyodide = pyodide;
    window.pyodideReady = true;
  } catch(e) { console.warn('Pyodide load failed', e); }
}

const AetherTT = {
  EOF:'EOF', ID:'ID', NUM:'NUM', STR:'STR',
  PLUS:'+', MINUS:'-', STAR:'*', SLASH:'/', PCT:'%',
  EQ:'=', EQEQ:'==', NEQ:'!=', LT:'<', GT:'>', LTE:'<=', GTE:'>=',
  AND:'&&', OR:'||', NOT:'!',
  LP:'(', RP:')', LB:'[', RB:']', LC:'{', RC:'}',
  COMMA:',', DOT:'.', COLON:':', SEMI:';',
  KW_LET:'let', KW_FN:'fn', KW_IF:'if', KW_ELSE:'else',
  KW_WHILE:'while', KW_FOR:'for', KW_RETURN:'return', KW_IN:'in',
  KW_TRUE:'true', KW_FALSE:'false', KW_NIL:'nil', KW_PRINT:'print'
};
const AetherKW = {};
for (const k of Object.keys(AetherTT)) if (k.startsWith('KW_')) AetherKW[AetherTT[k]] = AetherTT[k];
AetherKW['null'] = AetherTT.KW_NIL;

class AetherLexer {
  constructor(s){ this.s=String(s||''); this.i=0; this.line=1; }
  peek(){ return this.s[this.i]||''; }
  next(){ const c=this.s[this.i++]; if(c==='\n') this.line++; return c; }
  skip(){
    while(this.i<this.s.length){
      const c=this.peek();
      if(c===' '||c==='\t'||c==='\r'||c==='\n'){ this.next(); continue; }
      if(c==='#'||(c==='/'&&this.s[this.i+1]==='/')){ while(this.i<this.s.length&&this.peek()!=='\n') this.next(); continue; }
      if(c==='/'&&this.s[this.i+1]==='*'){ this.next(); this.next(); while(this.i<this.s.length&&!(this.peek()==='*'&&this.s[this.i+1]==='/')) this.next(); this.next(); this.next(); continue; }
      break;
    }
  }
  tokenize(){
    const toks=[];
    while(true){
      this.skip();
      if(this.i>=this.s.length){ toks.push({type:AetherTT.EOF,line:this.line}); break; }
      const c=this.peek();
      if(/[0-9]/.test(c)){
        let n=''; while(/[0-9.]/.test(this.peek())) n+=this.next();
        toks.push({type:AetherTT.NUM, value:parseFloat(n), line:this.line}); continue;
      }
      if(/[a-zA-Z_]/.test(c)){
        let id=''; while(/[a-zA-Z0-9_]/.test(this.peek())) id+=this.next();
        const kw=AetherKW[id];
        toks.push(kw ? {type:kw, value:id, line:this.line} : {type:AetherTT.ID, value:id, line:this.line}); continue;
      }
      if(c==='"'||c==="'"){
        const q=this.next(); let str='';
        while(this.i<this.s.length&&this.peek()!==q){
          if(this.peek()==='\\'){ this.next(); const e=this.next(); str += ({n:'\n',t:'\t',r:'\r','"':'"',"'":"'",'\\':'\\'}[e]||e); }
          else str+=this.next();
        }
        this.next();
        toks.push({type:AetherTT.STR, value:str, line:this.line}); continue;
      }
      const two=this.s.slice(this.i,this.i+2);
      const ops={'==':AetherTT.EQEQ,'!=':AetherTT.NEQ,'<=':AetherTT.LTE,'>=':AetherTT.GTE,'&&':AetherTT.AND,'||':AetherTT.OR};
      if(ops[two]){ this.next(); this.next(); toks.push({type:ops[two], line:this.line}); continue; }
      const one={'+':AetherTT.PLUS,'-':AetherTT.MINUS,'*':AetherTT.STAR,'/':AetherTT.SLASH,'%':AetherTT.PCT,'=':AetherTT.EQ,
        '<':AetherTT.LT,'>':AetherTT.GT,'!':AetherTT.NOT,'(':AetherTT.LP,')':AetherTT.RP,'[':AetherTT.LB,']':AetherTT.RB,
        '{':AetherTT.LC,'}':AetherTT.RC,',':AetherTT.COMMA,'.':AetherTT.DOT,':':AetherTT.COLON,';':AetherTT.SEMI};
      if(one[c]){ this.next(); toks.push({type:one[c], line:this.line}); continue; }
      throw new Error('Aether lex error at line '+this.line+': '+c);
    }
    return toks;
  }
}

class AetherParser {
  constructor(toks){ this.t=toks; this.i=0; }
  peek(){ return this.t[this.i]||{type:AetherTT.EOF}; }
  adv(){ return this.t[this.i++]; }
  match(...types){ if(types.includes(this.peek().type)) return this.adv(); return null; }
  expect(type){ const t=this.adv(); if(t.type!==type) throw new Error('Expected '+type+' got '+t.type+' (line '+t.line+')'); return t; }
  parse(){ const body=[]; while(this.peek().type!==AetherTT.EOF){ body.push(this.stmt()); this.match(AetherTT.SEMI); } return {type:'block', body}; }
  stmt(){
    const p=this.peek();
    if(p.type===AetherTT.KW_LET){ this.adv(); const name=this.expect(AetherTT.ID).value; this.expect(AetherTT.EQ); return {type:'let', name, value:this.expr()}; }
    if(p.type===AetherTT.KW_FN){ this.adv(); const name=this.expect(AetherTT.ID).value; this.expect(AetherTT.LP);
      const params=[]; if(this.peek().type!==AetherTT.RP){ do{ params.push(this.expect(AetherTT.ID).value); }while(this.match(AetherTT.COMMA)); }
      this.expect(AetherTT.RP); return {type:'fn', name, params, body:this.block()};
    }
    if(p.type===AetherTT.KW_IF){ this.adv(); const cond=this.expr(); const th=this.block(); let el=null;
      if(this.match(AetherTT.KW_ELSE)) el = this.peek().type===AetherTT.KW_IF ? this.stmt() : this.block();
      return {type:'if', cond, th, el};
    }
    if(p.type===AetherTT.KW_WHILE){ this.adv(); const cond=this.expr(); return {type:'while', cond, body:this.block()}; }
    if(p.type===AetherTT.KW_FOR){ this.adv(); const name=this.expect(AetherTT.ID).value; this.expect(AetherTT.KW_IN); const iter=this.expr();
      return {type:'for', name, iter, body:this.block()};
    }
    if(p.type===AetherTT.KW_RETURN){ this.adv(); return {type:'return', value: this.peek().type===AetherTT.RC||this.peek().type===AetherTT.EOF||this.peek().type===AetherTT.SEMI ? null : this.expr()}; }
    if(p.type===AetherTT.KW_PRINT){ this.adv(); const args=[]; if(this.match(AetherTT.LP)){ if(this.peek().type!==AetherTT.RP){ do{ args.push(this.expr()); }while(this.match(AetherTT.COMMA)); } this.expect(AetherTT.RP); } else if(this.peek().type!==AetherTT.SEMI&&this.peek().type!==AetherTT.RC&&this.peek().type!==AetherTT.EOF){ do{ args.push(this.expr()); }while(this.match(AetherTT.COMMA)); } return {type:'print', args}; }
    if(p.type===AetherTT.ID && this.t[this.i+1]&&this.t[this.i+1].type===AetherTT.EQ){ const name=this.adv().value; this.adv(); return {type:'assign', name, value:this.expr()}; }
    return {type:'expr', value:this.expr()};
  }
  block(){ this.expect(AetherTT.LC); const body=[]; while(this.peek().type!==AetherTT.RC&&this.peek().type!==AetherTT.EOF){ body.push(this.stmt()); this.match(AetherTT.SEMI); } this.expect(AetherTT.RC); return {type:'block', body}; }
  expr(){ return this.or(); }
  or(){ let l=this.and(); while(this.match(AetherTT.OR)){ const r=this.and(); l={type:'bin', op:'||', left:l, right:r}; } return l; }
  and(){ let l=this.eq(); while(this.match(AetherTT.AND)){ const r=this.eq(); l={type:'bin', op:'&&', left:l, right:r}; } return l; }
  eq(){ let l=this.cmp(); while(true){ const t=this.match(AetherTT.EQEQ,AetherTT.NEQ); if(!t) break; l={type:'bin', op:t.type, left:l, right:this.cmp()}; } return l; }
  cmp(){ let l=this.term(); while(true){ const t=this.match(AetherTT.LT,AetherTT.GT,AetherTT.LTE,AetherTT.GTE); if(!t) break; l={type:'bin', op:t.type, left:l, right:this.term()}; } return l; }
  term(){ let l=this.fact(); while(true){ const t=this.match(AetherTT.PLUS,AetherTT.MINUS); if(!t) break; l={type:'bin', op:t.type, left:l, right:this.fact()}; } return l; }
  fact(){ let l=this.unary(); while(true){ const t=this.match(AetherTT.STAR,AetherTT.SLASH,AetherTT.PCT); if(!t) break; l={type:'bin', op:t.type, left:l, right:this.unary()}; } return l; }
  unary(){ if(this.match(AetherTT.NOT,AetherTT.MINUS)){ const op=this.t[this.i-1].type; return {type:'unary', op, value:this.unary()}; } return this.call(); }
  call(){
    let e=this.primary();
    while(true){
      if(this.match(AetherTT.LP)){ const args=[]; if(this.peek().type!==AetherTT.RP){ do{ args.push(this.expr()); }while(this.match(AetherTT.COMMA)); } this.expect(AetherTT.RP); e={type:'call', callee:e, args}; }
      else if(this.match(AetherTT.LB)){ const idx=this.expr(); this.expect(AetherTT.RB); e={type:'index', object:e, index:idx}; }
      else if(this.match(AetherTT.DOT)){ const name=this.expect(AetherTT.ID).value; e={type:'prop', object:e, name}; }
      else break;
    }
    return e;
  }
  primary(){
    const t=this.peek();
    if(t.type===AetherTT.NUM){ this.adv(); return {type:'num', value:t.value}; }
    if(t.type===AetherTT.STR){ this.adv(); return {type:'str', value:t.value}; }
    if(t.type===AetherTT.KW_TRUE){ this.adv(); return {type:'bool', value:true}; }
    if(t.type===AetherTT.KW_FALSE){ this.adv(); return {type:'bool', value:false}; }
    if(t.type===AetherTT.KW_NIL){ this.adv(); return {type:'nil', value:null}; }
    if(t.type===AetherTT.ID){ this.adv(); return {type:'id', name:t.value}; }
    if(t.type===AetherTT.LP){ this.adv(); const e=this.expr(); this.expect(AetherTT.RP); return e; }
    if(t.type===AetherTT.LB){ this.adv(); const els=[]; if(this.peek().type!==AetherTT.RB){ do{ els.push(this.expr()); }while(this.match(AetherTT.COMMA)); } this.expect(AetherTT.RB); return {type:'list', elements:els}; }
    if(t.type===AetherTT.LC){ this.adv(); const keys=[], vals=[]; if(this.peek().type!==AetherTT.RC){ do{ const k = this.peek().type===AetherTT.STR||this.peek().type===AetherTT.ID ? this.adv().value : String(this.expr()); this.expect(AetherTT.COLON); keys.push(k); vals.push(this.expr()); }while(this.match(AetherTT.COMMA)); } this.expect(AetherTT.RC); return {type:'dict', keys, vals}; }
    throw new Error('Unexpected token '+t.type+' (line '+t.line+')');
  }
}

class AetherReturn { constructor(v){ this.value=v; } }

class AetherRT {
  constructor(printFn){
    this.printFn = printFn || ((...a)=>console.log(...a));
    this.globals = Object.create(null);
    this.installBuiltins();
  }
  installBuiltins(){
    const g=this.globals;
    const str=v=>{
      if(v===null||v===undefined) return 'nil';
      if(typeof v==='string') return v;
      if(typeof v==='number'||typeof v==='boolean') return String(v);
      if(Array.isArray(v)) return '['+v.map(str).join(', ')+']';
      if(typeof v==='object') return '{'+Object.entries(v).map(([k,x])=>k+': '+str(x)).join(', ')+'}';
      if(typeof v==='function') return '<fn>';
      return String(v);
    };
    g.print = (...a)=>{ this.printFn(a.map(str).join(' ')); return a[0]; };
    g.str = str; g.int = x=>Math.trunc(Number(x))||0; g.float = x=>Number(x)||0; g.bool = x=>!!x;
    g.type = v=>Array.isArray(v)?'list':v===null?'nil':typeof v;
    g.len = x=>x&&x.length!==undefined?x.length:0;
    g.range = (a,b)=>{ if(b===undefined){b=a;a=0;} const r=[]; for(let i=a;i<b;i++) r.push(i); return r; };
    g.push = (a,v)=>{ if(Array.isArray(a)) a.push(v); return a; };
    g.pop = a=>Array.isArray(a)?a.pop():null;
    g.join = (a,s)=>Array.isArray(a)?a.map(str).join(s??','):'';
    g.split = (s,sep)=>String(s).split(sep??',');
    g.slice = (a,i,j)=>a&&a.slice?a.slice(i,j):[];
    g.keys = d=>d&&typeof d==='object'?Object.keys(d):[];
    g.values = d=>d&&typeof d==='object'?Object.values(d):[];
    g.abs=Math.abs; g.floor=Math.floor; g.ceil=Math.ceil; g.round=Math.round;
    g.sqrt=Math.sqrt; g.sin=Math.sin; g.cos=Math.cos; g.pow=Math.pow;
    g.min=(...a)=>Math.min(...a.map(Number)); g.max=(...a)=>Math.max(...a.map(Number));
    g.rand=()=>Math.random(); g.time=()=>Date.now();
    g.pi=Math.PI; g.e=Math.E;
    g.upper=s=>String(s).toUpperCase(); g.lower=s=>String(s).toLowerCase(); g.trim=s=>String(s).trim();
    g.sum=a=>Array.isArray(a)?a.reduce((p,c)=>p+Number(c),0):0;
    g.map=(a,fn)=>Array.isArray(a)?a.map(x=>fn(x)): [];
    g.filter=(a,fn)=>Array.isArray(a)?a.filter(x=>fn(x)): [];
    g.os_time = ()=>new Date().toLocaleString();
    g.os_uptime = ()=> ((Date.now()-(typeof S!=='undefined'?S.boot:Date.now()))/1000)|0;
    g.os_log = (msg, level)=>{ if(typeof log==='function') log(String(msg), level||'INFO'); return msg; };
    g.os_toast = (msg)=>{ if(typeof toast==='function') toast(String(msg)); return msg; };
    g.os_open = (app)=>{ if(typeof open==='function') open(String(app)); return app; };
    g.os_notify = (msg, type, title)=>{ addNotification(String(msg), type||'info', title||''); return msg; };
    g.fs_list = ()=>{ if(typeof S==='undefined') return []; return Array.from(S.fs.keys()); };
    g.fs_read = (path)=>{ if(typeof S==='undefined') return null; return S.fs.has(path)?S.fs.get(path):null; };
    g.fs_write = (path, data)=>{ if(typeof S==='undefined') return false; S.fs.set(String(path), String(data)); if(typeof saveState==='function') saveState(); return true; };
    g.fs_search = (query)=>searchFiles(query);
    g.sys_cpu = ()=> (typeof S!=='undefined' ? S.hardware.cpu.load : 0);
    g.sys_ram = ()=> (typeof S!=='undefined' ? (S.hardware.ram.used/S.hardware.ram.total*100) : 0);
    g.sys_info = ()=>{
      if(typeof S==='undefined') return {os:'Æther OS'};
      return { os: 'Æther OS Ultimate', uptime: ((Date.now()-S.boot)/1000)|0,
        windows: S.wins.size, files: S.fs.size, cpu: S.hardware.cpu.load,
        ram: S.hardware.ram.used, automations: (S.automations||[]).length };
    };
    g.shell = (cmd)=>{
      const c=String(cmd||'').trim();
      if(c==='help') return 'help, info, ls, ps, neofetch, open <app>, aether <code>, search <query>';
      if(c==='info'||c==='neofetch') return str(g.sys_info());
      if(c==='ls') return str(g.fs_list());
      if(c.startsWith('open ')){ g.os_open(c.slice(5).trim()); return 'opened'; }
      if(c.startsWith('search ')){ const r = searchFiles(c.slice(7).trim()); return str(r); }
      return 'unknown: '+c;
    };
    // Image APIs
    g.image_create = (w,h)=>{
      const c=document.createElement('canvas');
      c.width=Math.max(8, Number(w)||64); c.height=Math.max(8, Number(h)||64);
      const ctx=c.getContext('2d');
      ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,c.width,c.height);
      return { __img:true, c, ctx, w:c.width, h:c.height };
    };
    g.image_fill = (img,r,gch,b)=>{ if(!img||!img.ctx) return null; img.ctx.fillStyle='rgb('+(r|0)+','+(gch|0)+','+(b|0)+')'; img.ctx.fillRect(0,0,img.w,img.h); return img; };
    g.image_pixel = (img,x,y,r,gch,b)=>{ if(!img||!img.ctx) return null; img.ctx.fillStyle='rgb('+(r|0)+','+(gch|0)+','+(b|0)+')'; img.ctx.fillRect(x|0,y|0,1,1); return img; };
    g.image_text = (img,t,x,y,r,gch,b)=>{ if(!img||!img.ctx) return null; img.ctx.fillStyle='rgb('+(r|0)+','+(gch|0)+','+(b|0)+')'; img.ctx.font='16px monospace'; img.ctx.fillText(String(t),x|0,y|0); return img; };
    g.image_save = (img, path)=>{
      if(!img||!img.c) return null;
      const url=img.c.toDataURL('image/png');
      const p=String(path||('/media/img_'+Date.now()+'.png'));
      if(typeof S!=='undefined'){ S.fs.set(p, url); if(typeof saveState==='function') saveState(); }
      if(!window.__aetherImages) window.__aetherImages=[];
      window.__aetherImages.push({path:p,url,ts:Date.now()});
      return url;
    };
    g.image_rect = (img,x,y,w,h,r,gc,b)=>{ if(!img||!img.ctx) return null; img.ctx.fillStyle='rgb('+(r|0)+','+(gc|0)+','+(b|0)+')'; img.ctx.fillRect(x|0,y|0,w|0,h|0); return img; };
    g.image_line = (img,x1,y1,x2,y2,r,gc,b)=>{ if(!img||!img.ctx) return null; img.ctx.strokeStyle='rgb('+(r|0)+','+(gc|0)+','+(b|0)+')'; img.ctx.beginPath(); img.ctx.moveTo(x1,y1); img.ctx.lineTo(x2,y2); img.ctx.stroke(); return img; };
    g.image_circle = (img,x,y,rad,r,gc,b)=>{ if(!img||!img.ctx) return null; img.ctx.fillStyle='rgb('+(r|0)+','+(gc|0)+','+(b|0)+')'; img.ctx.beginPath(); img.ctx.arc(x,y,rad,0,Math.PI*2); img.ctx.fill(); return img; };
    g.image_generate = (kind, w, h, seed)=>{
      const img=g.image_create(w||128, h||128);
      const ctx=img.ctx; const W=img.w, H=img.h;
      const s=Number(seed)||(Date.now()%10000);
      const rnd=(n)=>{ let x=Math.sin(s*12.9898+n*78.233)*43758.5453; return x-Math.floor(x); };
      kind=String(kind||'noise').toLowerCase();
      if(kind==='gradient'){
        for(let y=0;y<H;y++){ for(let x=0;x<W;x++){ const r=(x/W*255)|0, gch=(y/H*200)|0, b=((x+y)/(W+H)*255)|0; ctx.fillStyle=`rgb(${r},${gch},${b})`; ctx.fillRect(x,y,1,1); }}
      } else if(kind==='plasma'||kind==='noise'){
        for(let y=0;y<H;y++){ for(let x=0;x<W;x++){ const n=rnd(x*0.1+y*0.3)*255|0; const r=n, gch=(n*0.7+(x%40))|0, b=(80+rnd(y+x)*100)|0; ctx.fillStyle=`rgb(${r},${gch},${b})`; ctx.fillRect(x,y,1,1); }}
      } else if(kind==='checker'){
        for(let y=0;y<H;y++){ for(let x=0;x<W;x++){ const on=((x>>4)^(y>>4))&1; ctx.fillStyle=on?'#8b7cff':'#1b1b25'; ctx.fillRect(x,y,1,1); }}
      } else if(kind==='chart'){
        ctx.fillStyle='#0a0a12'; ctx.fillRect(0,0,W,H);
        ctx.strokeStyle='#8b7cff'; ctx.beginPath();
        for(let x=0;x<W;x++){ const v=H/2+Math.sin((x+s)*0.08)*H*0.3+Math.sin((x+s)*0.02)*H*0.1; if(x===0) ctx.moveTo(x,v); else ctx.lineTo(x,v); }
        ctx.stroke();
        ctx.fillStyle='#c4b5fd'; ctx.font='12px monospace'; ctx.fillText('signal '+s, 8, 16);
      } else if(kind==='avatar'){
        ctx.fillStyle='#1b1b25'; ctx.fillRect(0,0,W,H);
        ctx.fillStyle='#8b7cff'; ctx.beginPath(); ctx.arc(W/2,H*0.38,W*0.18,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(W/2,H*0.78,W*0.28,H*0.22,0,0,Math.PI*2); ctx.fill();
      } else { g.image_fill(img, 20, 20, 40); g.image_text(img, kind, 8, 24, 200, 200, 255); }
      return img;
    };
    g.assert = (cond, msg)=>{ if(!cond) throw new Error('assert failed: '+(msg||'')); return true; };
    g.test_eq = (a,b,msg)=>{ if(a!==b) throw new Error('test_eq failed: '+(msg||'')+' got '+str(a)+' expected '+str(b)); return true; };
    g.app_scaffold = (name, desc)=>{
      const n=String(name||'my-app').replace(/[^a-zA-Z0-9_-]/g,'-');
      const code = `# App: ${n}\n# ${desc||''}\nprint("Boot ${n}")\nlet info = sys_info()\nprint(info)\nfs_write("/apps/${n}/main.ae", "print(\"${n} ready\")")\nprint("Scaffolded /apps/${n}/")\n`;
      if(typeof S!=='undefined'){ S.fs.set('/apps/'+n+'/main.ae', code); S.fs.set('/apps/'+n+'/README.txt', String(desc||n)+'\nBuilt with Æther App Builder'); if(typeof saveState==='function') saveState(); }
      return { name:n, path:'/apps/'+n+'/main.ae', code };
    };
    g.app_run = (path)=>{ const p=String(path||''); const src = (typeof S!=='undefined' && S.fs.has(p)) ? S.fs.get(p) : null; if(!src) throw new Error('app not found: '+p); return this.run(src); };
    // Audio
    g.audio_beep = (freq, sec)=>{
      try { const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return 'no AudioContext';
        if(!window.__aetherAC) window.__aetherAC=new AC(); const ac=window.__aetherAC;
        const o=ac.createOscillator(); const g=ac.createGain();
        o.frequency.value=Number(freq)||440; o.type='sine';
        g.gain.value=0.08; o.connect(g); g.connect(ac.destination);
        const t=ac.currentTime; const dur=Math.min(2, Math.max(0.05, Number(sec)||0.2));
        g.gain.setValueAtTime(0.08,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
        o.start(t); o.stop(t+dur+0.02); return true;
      } catch(e){ return 'audio error: '+e.message; }
    };
    g.speak = (text)=>{ try { if(!window.speechSynthesis) return 'no speechSynthesis';
        const u=new SpeechSynthesisUtterance(String(text||'')); u.rate=1; u.pitch=1; window.speechSynthesis.speak(u); return true;
      } catch(e){ return e.message; }
    };
    g.llm_ask = (q)=>{
      const s=String(q||'').toLowerCase().trim();
      if(!s) return 'Ask me about building apps, images, audio, files, tests, or system tools.';
      const kb=[

  run(src){
    const lexer=new AetherLexer(src);
    const toks=lexer.tokenize();
    const parser=new AetherParser(toks);
    const ast=parser.parse();
    const env=Object.create(this.globals);
    try { return this.exec(ast, env); }
    catch(e){ if(e instanceof AetherReturn) return e.value; throw e; }
  }
  exec(node, env){
    if(!node) return null;
    switch(node.type){
      case 'block': { let last=null; for(const s of node.body) last=this.exec(s, env); return last; }
      case 'let': env[node.name]=this.eval(node.value, env); return env[node.name];
      case 'assign': {
        let e=env; while(e && !(node.name in e) && Object.getPrototypeOf(e)!==Object.prototype) e=Object.getPrototypeOf(e);
        if(node.name in env) env[node.name]=this.eval(node.value, env);
        else if(node.name in this.globals) this.globals[node.name]=this.eval(node.value, env);
        else env[node.name]=this.eval(node.value, env);
        return env[node.name]!==undefined?env[node.name]:this.globals[node.name];
      }
      case 'fn': {
        const fn=(...args)=>{
          const local=Object.create(env);
          node.params.forEach((p,i)=>local[p]=args[i]);
          try { return this.exec(node.body, local); }
          catch(e){ if(e instanceof AetherReturn) return e.value; throw e; }
        };
        env[node.name]=fn; return fn;
      }
      case 'if': return this.eval(node.cond, env) ? this.exec(node.th, env) : (node.el?this.exec(node.el, env):null);
      case 'while': { let last=null; let guard=0; while(this.eval(node.cond, env)){ last=this.exec(node.body, env); if(++guard>100000) throw new Error('while: infinite loop guard'); } return last; }
      case 'for': { const it=this.eval(node.iter, env); const arr=Array.isArray(it)?it: (typeof it==='string'?[...it]:[]); let last=null; for(const x of arr){ env[node.name]=x; last=this.exec(node.body, env); } return last; }
      case 'return': throw new AetherReturn(node.value?this.eval(node.value, env):null);
      case 'print': { const vals=node.args.map(a=>this.eval(a, env)); this.globals.print(...vals); return vals[vals.length-1]; }
      case 'expr': return this.eval(node.value, env);
      default: return this.eval(node, env);
    }
  }
  eval(node, env){
    if(!node) return null;
    switch(node.type){
      case 'num': case 'str': case 'bool': case 'nil': return node.value;
      case 'id': {
        if(node.name in env) return env[node.name];
        if(node.name in this.globals) return this.globals[node.name];
        throw new Error("Undefined '"+node.name+"'");
      }
      case 'list': return node.elements.map(e=>this.eval(e, env));
      case 'dict': { const o={}; for(let i=0;i<node.keys.length;i++) o[node.keys[i]]=this.eval(node.vals[i], env); return o; }
      case 'unary': { const v=this.eval(node.value, env); if(node.op===AetherTT.NOT||node.op==='!') return !v; if(node.op===AetherTT.MINUS||node.op==='-') return -Number(v); return v; }
      case 'bin': {
        const l=this.eval(node.left, env), r=this.eval(node.right, env);
        const op=node.op;
        if(op==='+'||op===AetherTT.PLUS) return (typeof l==='string'||typeof r==='string') ? (String(l)+String(r)) : (Number(l)+Number(r));
        if(op==='-'||op===AetherTT.MINUS) return Number(l)-Number(r);
        if(op==='*'||op===AetherTT.STAR) return Number(l)*Number(r);
        if(op==='/'||op===AetherTT.SLASH) return Number(l)/Number(r);
        if(op==='%'||op===AetherTT.PCT) return Number(l)%Number(r);
        if(op==='=='||op===AetherTT.EQEQ) return l===r;
        if(op==='!='||op===AetherTT.NEQ) return l!==r;
        if(op==='<'||op===AetherTT.LT) return l<r;
        if(op==='>'||op===AetherTT.GT) return l>r;
        if(op==='<='||op===AetherTT.LTE) return l<=r;
        if(op==='>='||op===AetherTT.GTE) return l>=r;
        if(op==='&&'||op===AetherTT.AND) return l&&r;
        if(op==='||'||op===AetherTT.OR) return l||r;
        return null;
      }
      case 'call': { const fn=this.eval(node.callee, env); if(typeof fn!=='function') throw new Error('Not a function'); return fn(...node.args.map(a=>this.eval(a, env))); }
      case 'index': { const o=this.eval(node.object, env), i=this.eval(node.index, env); return o!=null ? o[i] : null; }
      case 'prop': { const o=this.eval(node.object, env); return o!=null ? o[node.name] : null; }
      default: return null;
    }
  }
}

const VHW = {
  components: ['vCPU','vGPU','vTPU','vNPU','vQPU','vPPU','vLPU','vRAM','vVRAM','vCache','vStorage','vNet','vPhoton','vFabric','vBus','vReason','vMemory','vAttention','vPlan','vLearn','vReflect','vEncoder','vDecoder','vScheduler','vSecurity','vThermals'],
  mindKeys: ['vReason','vMemory','vAttention','vPlan','vLearn','vReflect'],
  computeKeys: ['vCPU','vGPU','vTPU','vNPU','vQPU','vPPU','vLPU'],
  ensure() { if (typeof S === 'undefined' || !S.vhw) return null; return S.vhw; },
  tick() {
    const v = this.ensure(); if (!v) return null;
    for (const k of this.components) { if (typeof v[k] !== 'number') v[k] = 10; const drift = (Math.random() - 0.48) * 6; v[k] = Math.max(1, Math.min(99, v[k] + drift)); }
    try {
      if (typeof AetherASI !== 'undefined' && AetherASI.stats) {
        const st = AetherASI.stats;
        v.vReason = Math.min(99, 8 + (st.reason || 0) * 3 + Math.random() * 5);
        v.vPlan = Math.min(99, 6 + (st.plan || 0) * 4 + Math.random() * 4);
        v.vLearn = Math.min(99, 5 + (st.learn || 0) * 5 + Math.random() * 4);
        v.vReflect = Math.min(99, 5 + (st.reflect || 0) * 4 + Math.random() * 3);
        v.vAttention = Math.min(99, 10 + (AetherASI.memory ? AetherASI.memory.length : 0) * 1.2);
        v.vMemory = Math.min(99, 12 + (AetherASI.knowledge ? AetherASI.knowledge.length : 0) * 2);
      }
    } catch (e) {}
    try {
      if (S.hardware) { S.hardware.cpu.load = v.vCPU; S.hardware.cpu.temp = 35 + v.vThermals * 0.4;
        S.hardware.ram.used = (v.vRAM / 100) * S.hardware.ram.total; S.hardware.ram.free = S.hardware.ram.total - S.hardware.ram.used;
        S.hardware.storage.used = (v.vStorage / 100) * S.hardware.storage.total; S.hardware.storage.free = S.hardware.storage.total - S.hardware.storage.used; }
    } catch (e) {}
    v.computeLoad = this._avg(this.computeKeys.map(k => v[k]));
    v.mindLoad = this._avg(this.mindKeys.map(k => v[k]));
    v.fabricHealth = Math.max(0, 100 - (v.vThermals * 0.3 + v.computeLoad * 0.2));
    v.powerDraw = Math.round(v.computeLoad * 1.8 + v.mindLoad * 0.9 + v.vGPU * 0.5);
    return this.snapshot();
  },
  _avg(arr) { if (!arr.length) return 0; return Math.round(arr.reduce((a, b) => a + b, 0) / arr.length); },
  snapshot() {
    const v = this.ensure(); if (!v) return {};
    const pack = (keys) => { const o = {}; for (const k of keys) o[k] = Math.round(v[k]); return o; };
    return {
      compute: pack(this.computeKeys), mind: pack(this.mindKeys),
      memory: pack(['vRAM','vVRAM','vCache','vStorage']),
      fabric: pack(['vFabric','vBus','vNet','vPhoton']),
      support: pack(['vEncoder','vDecoder','vScheduler','vSecurity','vThermals']),
      aggregates: { computeLoad: v.computeLoad, mindLoad: v.mindLoad, fabricHealth: Math.round(v.fabricHealth), powerDraw: v.powerDraw }
    };
  },
  pulse(unit, amount) {
    const v = this.ensure(); if (!v || typeof v[unit] !== 'number') return false;
    v[unit] = Math.max(1, Math.min(99, v[unit] + (Number(amount) || 10)));
    if (!S.vhwLog) S.vhwLog = [];
    S.vhwLog.push({ t: Date.now(), unit: unit, amount: amount, v: v[unit] });
    if (S.vhwLog.length > 80) S.vhwLog.shift();
    return v[unit];
  },
  attend(task) {
    const v = this.ensure(); if (!v) return null;
    this.pulse('vAttention', 12); this.pulse('vReason', 8); this.pulse('vPlan', 6);
    this.pulse('vCPU', 5); this.pulse('vNPU', 7);
    if (!S.vhwLog) S.vhwLog = [];
    S.vhwLog.push({ t: Date.now(), unit: 'attend', task: String(task || ''), mindLoad: v.mindLoad });
    return { task: task, mind: this.snapshot().mind, computeLoad: v.computeLoad };
  },
  compute(ops) {
    const n = Math.min(5e6, Math.max(1000, Number(ops) || 100000));
    const t0 = performance.now();
    let x = 0;
    for (let i = 0; i < n; i++) x = Math.sin(i * 0.001) + x * 0.0000001;
    const ms = performance.now() - t0;
    this.pulse('vCPU', 15); this.pulse('vGPU', 8); this.pulse('vRAM', 5);
    return { ops: n, ms: Math.round(ms * 100) / 100, checksum: Math.round(x * 1e6) / 1e6, load: this.snapshot().aggregates };
  },
  all() { return this.snapshot(); },
  log(n) { return (S.vhwLog || []).slice(-(n || 20)); }
};

const VHWOracle = {
  query(q) { if (typeof S !== 'undefined' && S.oracle) S.oracle.queries++; VHW.tick(); const snap = VHW.snapshot(); const s = String(q||'').toLowerCase(); let answer = null;
    if (/mind|brain|reason|attention/.test(s)) answer = { domain: 'mind', data: snap.mind, load: snap.aggregates.mindLoad };
    else if (/compute|cpu|gpu|tpu|qpu/.test(s)) answer = { domain: 'compute', data: snap.compute, load: snap.aggregates.computeLoad };
    else if (/health|fabric|power|thermal/.test(s)) answer = { domain: 'health', data: snap.aggregates, support: snap.support };
    else if (/memory|ram|storage|cache/.test(s)) answer = { domain: 'memory', data: snap.memory };
    else answer = { domain: 'full', data: snap };
    if (typeof S !== 'undefined' && S.oracle) S.oracle.lastAnswer = answer;
    return answer;
  },
  predict(horizon) { VHW.tick(); const snap = VHW.snapshot(); const h = Math.max(1, Number(horizon)||3);
    const pred = { steps: h, computeLoad: [], mindLoad: [], risk: 'low' };
    let c = snap.aggregates.computeLoad, m = snap.aggregates.mindLoad;

ages = []; render(); }; render(); }

function appAppBuilder() { const r = createWin('appbuilder', 'App Builder', 540, 460, `<div class="pad"><h3 style="margin-bottom:6px">Build → test → run</h3><p style="color:var(--dim);font-size:0.75rem;margin-bottom:8px">Scaffolds a real Æther mini-app under /apps/, with optional unit tests.</p><label>App name</label><input id="ab-name" value="sensor-watch"><label>Description</label><input id="ab-desc" value="Watch CPU and toast on threshold"><label>Template</label><select id="ab-tpl"><option value="health">Health / ops check</option><option value="image">Image generator tool</option><option value="audio">Audio notifier</option><option value="blank">Blank main.ae</option></select><div class="row-btns" style="margin-top:10px"><button class="btn pri" id="ab-build">Scaffold</button><button class="btn green" id="ab-run">Run main.ae</button><button class="btn" id="ab-test">Run tests</button><button class="btn" id="ab-open">Open Playground</button></div><pre id="ab-out" style="margin-top:10px;max-height:180px;overflow:auto;background:#0a0a10;padding:8px;border-radius:8px;font-size:0.72rem;"></pre></div>`); const out = r.el.querySelector('#ab-out'); const log = (t) => { out.textContent += t + '\\n'; out.scrollTop = out.scrollHeight; }; function name() { return (r.el.querySelector('#ab-name').value || 'app').replace(/[^a-zA-Z0-9_-]/g,'-'); } function tplCode(n, desc, tpl) { if (tpl === 'image') return `# ${n} — image tool\\nprint("Generating…")\\nlet img = image_generate("chart", 160, 80, int(time() % 1000))\\nimage_text(img, "${n}", 8, 16, 255,255,255)\\nimage_save(img, "/media/${n}.png")\\nprint("Saved /media/${n}.png")\\nos_open("images")\\n`; if (tpl === 'audio') return `# ${n} — audio notifier\\nprint("Notify")\\naudio_beep(660, 0.15)\\nspeak("${n} complete")\\nos_toast("${n} done")\\n`; if (tpl === 'blank') return `# ${n}\\n# ${desc}\\nprint("${n} ready")\\n`; return `# ${n} — health\\nprint("=== ${n} ===")\\nlet info = sys_info()\\nprint(info)\\nlet cpu = sys_cpu()\\
