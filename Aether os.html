function appAutomation() { const r = createWin('automation', 'Automation', 560, 450, `<div class="auto-dash" id="auto-dash"><div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;"><button class="btn pri" id="auto-new">+ New Rule</button><button class="btn" id="auto-refresh">⟳ Refresh</button><span style="font-size:0.7rem;color:var(--dim);margin-left:auto;">${S.automations.length} rules</span></div><div id="auto-list"></div><div style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;"><div style="font-size:0.7rem;color:var(--dim);margin-bottom:4px;">Execution Log</div><div class="auto-logs" id="auto-logs"></div></div></div>`); const listEl = r.el.querySelector('#auto-list'), logsEl = r.el.querySelector('#auto-logs'); function renderLogs() { const logs = S.automationLogs.slice(-20); logsEl.innerHTML = logs.map(l => { const time = new Date(l.time).toLocaleTimeString(); const cls = l.ok ? 'ok' : 'err'; return `<div class="log-entry"><span class="time">[${time}]</span> <span class="${cls}">${l.msg}</span></div>`; }).join('') || '<div style="color:var(--dim);font-size:0.7rem;">No automation logs</div>'; logsEl.scrollTop = logsEl.scrollHeight; } function renderRules() { listEl.innerHTML = ''; if (!S.automations.length) { listEl.innerHTML = '<div style="color:var(--dim);padding:12px;">No automation rules. Create one!</div>'; return; } S.automations.forEach(rule => { const div = document.createElement('div'); div.className = 'auto-rule'; const statusClass = rule.enabled ? 'on' : 'off'; const statusText = rule.enabled ? '● ON' : '○ OFF'; div.innerHTML = `<div class="header"><span class="name">${rule.name}</span><span class="status ${statusClass}">${statusText}</span></div><div class="details"><span>Trigger: ${rule.trigger.type}</span><span>Action: ${rule.action.type}</span>${rule.lastRun ? `<span>Last: ${new Date(rule.lastRun).toLocaleTimeString()}</span>` : ''}${rule.nextRun ? `<span>Next: ${new Date(rule.nextRun).toLocaleTimeString()}</span>` : >Run Script (JS)</option><option value="runPython">Run Python</option><option value="writeFile">Write File</option><option value="readFile">Read File</option><option value="bluetoothScan">Bluetooth Scan</option><option value="wifiToggle">Toggle WiFi</option><option value="hotspotToggle">Toggle Hotspot</option><option value="mountFolder">Mount Folder</option><option value="systemCommand">System Command</option><option value="httpRequest">HTTP Request</option><option value="customEvent">Emit Custom Event</option></select></div><div class="row"><label>Action Params</label><input id="af-aparams" placeholder="e.g. message=Hello or appId=chat or script=..."></div><div class="row"><label>Schedule (optional)</label><input id="af-schedule" placeholder="interval:10s, daily:09:00, weekly:1 09:00"></div><div class="row"><button class="btn pri" id="af-save">Create</button><button class="btn" id="af-cancel">Cancel</button></div></div>`; const overlay = document.createElement('div'); overlay.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:center;justify-content:center;'; overlay.innerHTML = `<div style="background:var(--panel);border-radius:12px;padding:16px;max-width:400px;width:90%;max-height:80%;overflow-y:auto;">${formHtml}</div>`; r.el.querySelector('.wbody').appendChild(overlay); overlay.querySelector('#af-cancel').onclick = () => overlay.remove(); overlay.querySelector('#af-save').onclick = () => { const name = overlay.querySelector('#af-name').value || 'Unnamed'; const triggerType = overlay.querySelector('#af-trigger').value; const actionType = overlay.querySelector('#af-action').value; const tparams = overlay.querySelector('#af-tparams').value; const aparams = overlay.querySelector('#af-aparams').value; const scheduleStr = overlay.querySelector('#af-schedule').value; const parseParams = (str) => { const obj = {}; if (!str) return obj; str.split(',').forEach(pair => { const [k, ...v] = pair.split('='); if (k) obj[k.trim()] = v.join('=').trim(); }); return obj; }; const trigger = { type: triggerType, params: parseParams(tparams) }; const action = { type: actionType, params: parseParams(aparams) }; let schedule = null; if (scheduleStr) { if (scheduleStr.startsWith('interval:')) { const val = scheduleStr.replace('interval:',''); const match = val.match(/(\d+)(s|m|h)/); if (match) { const num = parseInt(match[1]); const unit = match[2]; const obj = { type: 'interval' }; if (unit === 's') obj.seconds = num; else if (unit === 'm') obj.minutes = num; else if (unit === 'h') obj.hours = num; schedule = obj; } } else if (scheduleStr.startsWith('daily:')) { const time = scheduleStr.replace('daily:',''); const [h,m] = time.split(':').map(Number); schedule = { type: 'daily', hour: h || 0, minute: m || 0 }; } else if (scheduleStr.startsWith('weekly:')) { const parts = scheduleStr.replace('weekly:','').split(' '); const [day, time] = parts; const [h,m] = (time || '09:00').split(':').map(Number); schedule = { type: 'weekly', day: parseInt(day) || 0, hour: h || 0, minute: m || 0 }; } } const rule = addAutomation(name, trigger, action, schedule); if (schedule) { rule.nextRun = calculateNextRun(schedule); saveState(); } overlay.remove(); renderRules(); renderLogs(); toast('Rule created: '+name); }; }; r.el.querySelector('#auto-refresh').onclick = () => { renderRules(); renderLogs(); }; const logInterval = setInterval(() => { if (document.body.contains(r.el)) renderLogs(); else clearInterval(logInterval); }, 2000); renderRules(); renderLogs(); }

function app3D() { const r = createWin('3d', '3D Viewer', 500, 400, `<div class="three-container" id="three-container" style="width:100%;height:100%;background:#111;"></div>`); setTimeout(() => { const container = r.el.querySelector('#three-container'); const scene = new THREE.Scene(); scene.background = new THREE.Color(0x111122); const camera = new THREE.PerspectiveCamera(45, container.clientWidth/container.clientHeight, 0.1, 1000); camera.position.set(2,2,5); const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(container.clientWidth, container.clientHeight); container.appendChild(renderer.domElement); const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; const geometry = new THREE.BoxGeometry(1,1,1); const material = new THREE.MeshStandardMaterial({ color: 0x8b7cff, roughness: 0.4, metalness: 0.1 }); const cube = new THREE.Mesh(geometry, material); scene.add(cube); const light = new THREE.DirectionalLight(0xffffff, 1); light.position.set(5,10,7); scene.add(light); scene.add(new THREE.AmbientLight(0x404060)); function animate() { requestAnimationFrame(animate); cube.rotation.x += 0.01; cube.rotation.y += 0.02; controls.update(); renderer.render(scene, camera); } animate(); const ro = new ResizeObserver(() => { const w=container.clientWidth, h=container.clientHeight; camera.aspect = w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h); }); ro.observe(container); }, 50); }

function appNetwork() { const r = createWin('network', 'Network', 380, 450, '<div class="net" id="nr"></div>'); const root = r.el.querySelector('#nr'); function render() { const n = S.net; const wifiRows = (n.wifiList.length ? n.wifiList : [n.ssid]).map(ssid => { const on = n.wifi && ssid === n.ssid; return `<div class="nrow${on?' on':''}" data-w="${ssid}">${ssid}${on?' · connected':''}<span class="r">${on?n.signal+'%':'···'}</span></div>`; }).join(''); const btRows = (n.devices||[]).map(d => `<div class="nrow">${d}</div>`).join('') || '<div style="color:var(--dim);font-size:0.78rem;padding:4px">Scan for devices</div>'; const bandwidth = S.net.bandwidthHistory.slice(-10); const bwGraph = bandwidth.map((b,i) => `<span style="display:inline-block;width:8px;height:${Math.min(30, b.downlink*3)}px;background:var(--accent);margin:0 1px;"></span>`).join(''); root.innerHTML = `<h3>Wi‑Fi <button class="toggle${n.wifi?' on':''}" id="tw"></button></h3>${wifiRows}<div class="row-btns"><button class="btn" id="sw">Scan</button><button class="btn" id="dw">Disconnect</button></div><h3>Bluetooth <button class="toggle${n.bt?' on':''}" id="tb"></button></h3>${btRows}<div class="row-btns"><button class="btn" id="sb">Scan</button></div><h3>Hotspot <button class="toggle${n.hotspot?' on':''}" id="th"></button></h3><div class="nrow">${n.hotspot?n.hsName+' · active':'Off'}</div><h3>Light-speed link</h3><div class="meta">Mode ${n.link.mode}\nLatency ${n.link.ms} ms\nThroughput ${n.link.mbps} Mbps\nIP ${n.ip} · MAC ${n.mac} · DNS ${n.dns}</div><h3>Bandwidth (last 10 samples)</h3><div style="display:flex;align-items:end;height:40px;gap:2px;margin:4px 0;background:var(--elevated);border-radius:6px;padding:4px;">${bwGraph || '—'}</div><div class="row-btns"><button class="btn pri" id="ls">Instant scan</button><button class="btn" id="rd">Read status</button><button class="btn" id="lp">Load profile</button></div>`; root.querySelector('#tw').onclick = () => { n.wifi=!n.wifi; saveState(); updateBadge(); render(); toast(n.wifi?'Wi‑Fi on':'Wi‑Fi off'); EventBus.emit('network:changed', { wifi: n.wifi }); }; root.querySelector('#tb').onclick = () => { n.bt=!n.bt; saveState(); updateBadge(); render(); toast(n.bt?'BT on':'BT off'); }; root.querySelector('#th').onclick = () => { n.hotspot=!n.hotspot; saveState(); updateBadge(); render(); toast(n.hotspot?'Hotspot on':'Hotspot off'); }; root.querySelector('#sw').onclick = () => { netScan(); render(); toast('Wi‑Fi scanned'); }; root.querySelector('#sb').onclick = () => { netScan(); render(); toast('BT scanned'); }; root.querySelector('#dw').onclick = () => { n.wifi=false; saveState(); updateBadge(); render(); toast('Disconnected'); }; root.querySelector('#ls').onclick = () => { netScan(); render(); toast('Scan · '+n.link.ms+'ms'); }; root.querySelector('#rd').onclick = () => { toast(`Wi‑Fi ${n.wifi?n.ssid:'off'} · IP ${n.ip}`); }; root.querySelector('#lp').onclick = async () => { const raw = await vfsRead('/net/profile.json'); if (!raw) { toast('No profile'); return; } try { const p = JSON.parse(raw); if(p.ssid) n.ssid=p.ssid; if(p.mode) n.link.mode=p.mode; n.wifi=true; saveState(); updateBadge(); render(); toast('Profile loaded'); } catch(e) { toast('Bad profile'); } }; root.querySelectorAll('[data-w]').forEach(row => { row.onclick = () => { n.wifi=true; n.ssid=row.getAttribute('data-w'); n.signal=80+(Math.random()*20|0); saveState(); updateBadge(); render(); toast('Connected · '+n.ssid); EventBus.emit('network:changed', { wifi: true, ssid: n.ssid }); }; }); } netScan(); render(); }

function appBluetooth() { const r = createWin('bluetooth', 'Bluetooth', 380, 350, '<div class="pad" id="btui"></div>'); const root = r.el.querySelector('#btui'); function render() { const connected = S.bluetooth.device; const devices = S.bluetooth.discovered || []; let html = `<h3>Bluetooth</h3><p><button class="btn pri" id="bt-scan">Scan</button></p>`; html += `<div>Status: ${connected ? 'Connected to '+ (connected.name || 'device') : 'Disconnected'}</div>`; html += `<h4>Discovered devices</h4>`; devices.forEach(d => { html += `<div class="nrow">${d.name || d.id || 'Unknown'}</div>`; }); html += `<p><button class="btn" id="bt-disconnect">Disconnect</button></p>`; root.innerHTML = html; root.querySelector('#bt-scan').onclick = scanBluetooth; root.querySelector('#bt-disconnect').onclick = () => { if (S.bluetooth.device && S.bluetooth.device.gatt) { S.bluetooth.device.gatt.disconnect(); } S.bluetooth.device = null; updateBTBadge(); render(); toast('Disconnected'); EventBus.emit('bluetooth:disconnected', {}); }; } render(); const interval = setInterval(() => { if (document.body.contains(r.el)) render(); else clearInterval(interval); }, 3000); }

function appFiles() { const r = createWin('files', 'HyperFS', 360, 300, `<div style="padding:6px 8px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap;"><button class="btn" id="nf">New</button><button class="btn" id="upf">Upload</button><button class="btn" id="mount-btn">Mount</button></div><div class="file-search"><input id="fs-search" placeholder="Search files…"><span class="results" id="fs-results"></span></div><div class="files" id="fl"></div>`); const list = r.el.querySelector('#fl'); const searchInput = r.el.querySelector('#fs-search'); const resultsSpan = r.el.querySelector('#fs-results'); function draw(query) { list.innerHTML = ''; let entries = Array.from(S.fs.entries()); if (query) { const q = query.toLowerCase(); entries = entries.filter(([path, entry]) => path.toLowerCase().includes(q) || (entry.content && entry.content.toLowerCase().includes(q))); resultsSpan.textContent = entries.length + ' matches'; } else { resultsSpan.textContent = ''; } entries.forEach(([path, entry]) => { const d = document.createElement('div'); d.className = 'file'; const name = path.split('/').pop(); d.innerHTML = `<div style="font-size:1.15rem;margin-bottom:2px">📄</div>${name}`; d.onclick = () => { open('editor'); setTimeout(() => { const ta = document.querySelector('.editor textarea'); if (ta) ta.value = entry.content; toast('Opened '+name); }, 50); }; d.oncontextmenu = (e) => { e.preventDefault(); if(confirm('Delete '+path+'?')) { S.fs.delete(path); saveState(); draw(); } }; list.appendChild(d); }); (S.mounts || []).forEach(mount => { const d = document.createElement('div'); d.className = 'file'; d.innerHTML = `<div style="font-size:1.15rem;margin-bottom:2px">📁</div>${mount.name}`; d.onclick = () => { toast('Mounted: '+mount.name); }; d.oncontextmenu = (e) => { e.preventDefault(); if(confirm('Unmount '+mount.name+'?')) { const idx = S.mounts.indexOf(mount); if (idx > -1) { S.mounts.splice(idx, 1); draw(); toast('Unmounted'); } } }; list.appendChild(d); }); } r.el.querySelector('#nf').onclick = () => { const n = prompt('Path e.g. /note.txt'); if (!n) return; const path = n.startsWith('/') ? n : '/'+n; vfsWrite(path, ''); draw(); }; r.el.querySelector('#upf').onclick = () => { const input = document.createElement('input'); input.type = 'file'; input.multiple = true; input.onchange = async () => { for (const file of input.files) { const text = await file.text(); await vfsWrite('/'+file.name, text); } draw(); toast('Uploaded '+input.files.length+' files'); }; input.click(); }; r.el.querySelector('#mount-btn').onclick = mountRealFolder; searchInput.oninput = () => draw(searchInput.value); window._refreshFiles = draw; draw(); }

function appNotes() { const r = createWin('notes', 'Notes', 320, 220, '<textarea class="notes" id="na"></textarea>'); const a = r.el.querySelector('#na'); a.value = S.notes || ''; a.oninput = () => { S.notes = a.value; saveState(); }; }

function appKOS() { const r = createWin('kos', 'KOS Knowledge', 460, 380, '<div class="pad" style="font-size:0.8rem;line-height:1.45"><p style="color:var(--dim);margin-bottom:8px">Knowledge graph — add, query, verify</p><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><button class="btn pri" id="kos-add">Add node</button><button class="btn" id="kos-q">Query</button><button class="btn" id="kos-st">Status</button></div><div id="kos-out" style="font-family:var(--mono);font-size:0.72rem;white-space:pre-wrap;max-height:260px;overflow:auto"></div></div>'); const out = r.el.querySelector('#kos-out'); function show(x) { out.textContent = typeof x === 'object' ? JSON.stringify(x, null, 2) : String(x); } r.el.querySelector('#kos-st').onclick = () => show(KOS.status()); r.el.querySelector('#kos-q').onclick = () => { const q = prompt('Query terms:', 'aether'); if (q) show(KOS.query(q, 10)); }; r.el.querySelector('#kos-add').onclick = () => { const t = prompt('Title:'); if (!t) return; const body = prompt('Body:') || ''; show(KOS.add(t, 'concept', body, '', 0.6)); toast('KOS node added'); }; show(KOS.status()); }

function appPixels() { const r = createWin('pixels', 'Pixels', 360, 300, '<div class="pixel" id="pxl"></div>'); const container = r.el.querySelector('#pxl'); function render() { let html = ''; S.pixel.forEach((p, id) => { html += `<div class="pix-item"><span class="label">${id}</span><span class="val">${p.type} · ${p.label}</span></div>`; }); html += `<div style="margin-top:10px;"><button class="btn" id="new-pixel">New Pixel</button></div>`; container.innerHTML = html; container.querySelector('#new-pixel').onclick = () => { const type = prompt('Type (llm, game, vm, app, file):', 'app'); const label = prompt('Label:', 'My Pixel'); if (type && label) { const id = 'px' + (S.pixel.size+1); S.pixel.set(id, { type, label, data: '' }); saveState(); render(); toast('Pixel created'); if (type === 'llm') open('chat'); else if (type === 'game') open('3d'); else if (type === 'vm') open('terminal'); else if (type === 'app') open('docs'); else if (type === 'file') open('files'); } }; } render(); }

function appVHW() { const r = createWin('vhw', 'VHW Oracle', 520, 420, '<div class="vhw" id="vb" style="padding:8px;overflow:auto;height:100%"><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><button class="btn pri" id="vhw-tick">Tick</button><button class="btn" id="vhw-pulse">Pulse CPU</button><button class="btn" id="vhw-attend">Attend (mind)</button><button class="btn" id="vhw-compute">Compute</button></div><div id="vhw-agg" style="font-size:0.75rem;margin-bottom:8px;color:var(--dim)"></div><div id="vhw-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:6px"></div><div id="vhw-log" style="margin-top:8px;font-family:var(--mono);font-size:0.68rem;color:var(--dim);max-height:90px;overflow:auto"></div></div>'); const grid = r.el.querySelector('#vhw-grid'), agg = r.el.querySelector('#vhw-agg'), logEl = r.el.querySelector('#vhw-log'); function bar(label, pct, color) { const p = Math.max(0, Math.min(100, Math.round(pct))); return '<div class="vh"><h4>' + label + ' <span style="float:right">' + p + '%</span></h4><div class="bar"><i style="width:' + p + '%;background:' + (color||'linear-gradient(90deg,var(--accent),var(--accent2))') + '"></i></div></div>'; } function render() { if (!document.body.contains(grid)) return; VHW.tick(); const snap = VHW.snapshot(); const a = snap.aggregates || {}; agg.innerHTML = 'compute <b>' + (a.computeLoad||0) + '%</b> · mind <b>' + (a.mindLoad||0) + '%</b> · fabric <b>' + (a.fabricHealth||0) + '%</b> · power <b>' + (a.powerDraw||0) + '</b>W'; let h = '<div style="grid-column:1/-1;font-size:0.7rem;color:var(--accent2)">Compute</div>'; Object.keys(snap.compute||{}).forEach(k => { h += bar(k, snap.compute[k], 'linear-gradient(90deg,#8b7cff,#22d3ee)'); }); h += '<div style="grid-column:1/-1;font-size:0.7rem;color:var(--accent2);margin-top:4px">Mind (logical)</div>'; Object.keys(snap.mind||{}).forEach(k => { h += bar(k, snap.mind[k], 'linear-gradient(90deg,#34d399,#8b7cff)'); }); h += '<div style="grid-column:1/-1;font-size:0.7rem;color:var(--accent2);margin-top:4px">Memory / Fabric</div>'; Object.keys(snap.memory||{}).forEach(k => { h += bar(k, snap.memory[k]); }); Object.keys(snap.fabric||{}).forEach(k => { h += bar(k, snap.fabric[k]); }); Object.keys(snap.support||{}).forEach(k => { h += bar(k, snap.support[k]); }); grid.innerHTML = h; logEl.textContent = (VHW.log(10)||[]).map(e => { const t = new Date(e.t).toLocaleTimeString(); if (e.task) return t + ' attend ' + e.task; return t + ' ' + (e.unit||'') + ' +' + (e.amount||''); }).join('\n'); } window._vhwTick = render; r.el.querySelector('#vhw-tick').onclick = () => { VHW.tick(); render(); toast('VHW tick'); }; r.el.querySelector('#vhw-pulse').onclick = () => { VHW.pulse('vCPU', 20); VHW.pulse('vGPU', 10); render(); }; r.el.querySelector('#vhw-attend').onclick = () => { VHW.attend('user-focus'); render(); toast('Mind attend'); }; r.el.querySelector('#vhw-compute').onclick = () => { const r0 = VHW.compute(200000); toast('Compute ' + r0.ms + 'ms'); render(); }; render(); }

function appSysMon() { const r = createWin('sysmon', 'System Monitor', 500, 350, `<div class="sysmon"><canvas id="syschart"></canvas><div class="stats"><div>CPU: <span id="cpuload">0</span>%</div><div>RAM: <span id="ramused">0</span>GB / <span id="ramtotal">0</span>GB</div><div>Battery: <span id="batlevel">0</span>%</div><div>Temp: <span id="cputemp">0</span>°C</div></div></div>`); const canvas = r.el.querySelector('#syschart'), ctx = canvas.getContext('2d'); let data = { cpu: [], ram: [] }; function resize() { const rect = canvas.parentElement.getBoundingClientRect(); const w = rect.width - 20, h = rect.height - 60; canvas.width = w; canvas.height = h; } function draw() { resize(); const w = canvas.width, h = canvas.height; ctx.clearRect(0,0,w,h); ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 0.5; for (let i=0; i<10; i++) { const y = (h/10)*i; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); } ctx.strokeStyle = '#8b7cff'; ctx.lineWidth = 2; ctx.beginPath(); data.cpu.forEach((v,i) => { const x = (i/data.cpu.length)*w, y = h - (v/100)*h; i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); }); ctx.stroke(); ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2; ctx.beginPath(); data.ram.forEach((v,i) => { const x = (i/data.ram.length)*w, y = h - (v/100)*h; i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); }); ctx.stroke(); document.getElementById('cpuload').textContent = S.hardware.cpu.load.toFixed(1); document.getElementById('ramused').textContent = S.hardware.ram.used.toFixed(1); document.getElementById('ramtotal').textContent = S.hardware.ram.total.toFixed(1); document.getElementById('batlevel').textContent = S.hardware.battery.level.toFixed(0); document.getElementById('cputemp').textContent = S.hardware.cpu.temp.toFixed(1); } window._hwMonitor = () => { data.cpu.push(S.hardware.cpu.load); data.ram.push((S.hardware.ram.used / S.hardware.ram.total) * 100); if (data.cpu.length > 60) data.cpu.shift(); if (data.ram.length > 60) data.ram.shift(); draw(); }; for (let i=0; i<30; i++) { data.cpu.push(20 + Math.random()*30); data.ram.push(30 + Math.random()*20); } window._hwMonitor(); window.addEventListener('resize', draw); }

function appDiskUtil() { const r = createWin('diskutil', 'Disk Utility', 400, 300, '<div class="pad" id="diskui"></div>'); const container = r.el.querySelector('#diskui'); function render() { let html = '<h3>Partitions</h3>'; S.disk.partitions.forEach(p => { const usedPercent = (p.used / p.total * 100).toFixed(0); html += `<div style="margin:6px 0;padding:6px;background:var(--elevated);border-radius:6px;"><b>${p.mount}</b> (${p.format}) – ${p.used.toFixed(1)}GB / ${p.total}GB (${usedPercent}%)<div class="bar"><i style="width:${usedPercent}%"></i></div></div>`; }); html += `<h3>Total Storage</h3><div>Total: ${S.hardware.storage.total.toFixed(1)} GB</div><div>Used: ${S.hardware.storage.used.toFixed(1)} GB</div><div>Free: ${S.hardware.storage.free.toFixed(1)} GB</div>`; container.innerHTML = html; } render(); const interval = setInterval(() => { if (document.body.contains(r.el)) render(); else clearInterval(interval); }, 5000); }

function appTaskMgr() { const r = createWin('taskmgr', 'Task Manager', 400, 300, '<div class="pad" id="tm" style="font-family:var(--mono);font-size:0.78rem;"></div>'); const container = r.el.querySelector('#tm'); function render() { let html = '<table style="width:100%;border-collapse:collapse;">'; html += '<tr><th>PID</th><th>Name</th><th>CPU%</th><th>Mem(MB)</th><th></th></tr>'; S.processes.forEach(p => { html += `<tr><td>${p.pid}</td><td>${p.name}</td><td>${p.cpu.toFixed(1)}</td><td>${p.mem.toFixed(1)}</td><td><button class="btn" data-pid="${p.pid}" style="font-size:0.6rem;padding:1px 6px;">kill</button></td></tr>`; }); html += '</table>'; container.innerHTML = html; container.querySelectorAll('[data-pid]').forEach(btn => { btn.onclick = () => { const pid = parseInt(btn.dataset.pid); if (pid <= 2) { toast('Cannot kill system process'); return; } const idx = S.processes.findIndex(p => p.pid === pid); if (idx > -1) { S.processes.splice(idx, 1); saveState(); render(); toast('Killed PID '+pid); } }; }); } render(); const interval = setInterval(() => { if (document.body.contains(r.el)) render(); else clearInterval(interval); }, 3000); }

function appLogs() { const r = createWin('logs', 'System Log', 500, 350, `<div class="pad" id="lg" style="font-family:var(--mono);font-size:0.75rem;overflow-y:auto;height:100%;"><div style="margin-bottom:6px;display:flex;gap:8px;"><button class="btn" data-filter="all">All</button><button class="btn" data-filter="INFO">Info</button><button class="btn" data-filter="WARN">Warn</button><button class="btn" data-filter="ERROR">Error</button></div><div id="loglist"></div></div>`); const container = r.el.querySelector('#loglist'); let filter = 'all'; r.el.querySelectorAll('[data-filter]').forEach(btn => { btn.onclick = () => { filter = btn.dataset.filter; render(); }; }); function render() { const logs = filter === 'all' ? S.logs : S.logs.filter(l => l.level === filter); container.innerHTML = logs.map(l => { const time = new Date(l.time).toLocaleTimeString(); const cls = 'log-'+l.level.toLowerCase(); return `<div class="${cls}">[${time}] [${l.level}] ${l.msg}</div>`; }).join('') || '<div style="color:var(--dim)">No logs</div>'; } render(); const interval = setInterval(() => { if (document.body.contains(r.el)) render(); else clearInterval(interval); }, 2000); }

function appModules() { const r = createWin('modules', 'Kernel Modules', 320, 250, '<div class="pad" id="km"></div>'); const container = r.el.querySelector('#km'); function render() { let html = '<h3>Loaded Modules</h3>'; S.modules.forEach(mod => { html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);"><span>${mod}</span><span style="color:var(--green)">● loaded</span><button class="btn" data-mod="${mod}" style="font-size:0.6rem;">unload</button></div>`; }); container.innerHTML = html; container.querySelectorAll('[data-mod]').forEach(btn => { btn.onclick = () => { const mod = btn.dataset.mod; const idx = S.modules.indexOf(mod); if (idx > -1) { S.modules.splice(idx, 1); saveState(); render(); toast('Unloaded '+mod); } }; }); const addBtn = document.createElement('button'); addBtn.className = 'btn'; addBtn.textContent = 'Load module'; addBtn.onclick = () => { const name = prompt('Module name:'); if (name && !S.modules.includes(name)) { S.modules.push(name); saveState(); render(); toast('Loaded '+name); } }; container.appendChild(addBtn); } render(); }

function appSettings() { const r = createWin('settings', 'Settings', 300, 220, `<div class="pad"><label>Status label</label><input id="sl"><button class="btn" id="theme-btn" style="margin-top:6px">Toggle Theme</button><button class="btn" id="clr" style="margin-top:6px">Clear stored data</button><p style="margin-top:12px;color:var(--dim);font-size:0.78rem">Right-click desktop · Start search · Automation enabled</p></div>`); const sl = r.el.querySelector('#sl'); sl.value = S.settings.label || ''; sl.onchange = () => { S.settings.label = sl.value; saveState(); toast('Saved'); }; r.el.querySelector('#theme-btn').onclick = toggleTheme; r.el.querySelector('#clr').onclick = () => { if (confirm('Clear all saved data?')) { localStorage.removeItem('aether-ultimate-v2'); location.reload(); } }; }

function appSys() { const up = (Date.now()-S.boot)/1000|0; const st = { wifi: S.net.wifi ? S.net.ssid+' ('+S.net.signal+'%)' : 'off', bt: S.net.bt?'on':'off', hotspot: S.net.hotspot?S.net.hsName:'off', link: S.net.link.mode+' · '+S.net.link.ms+'ms · '+S.net.link.mbps+' Mbps' }; createWin('sys', 'System', 320, 280, `<div class="mono-block">Æther OS Ultimate\nAutomation ${S.automations.length} rules\nUptime   ${up}s\nWindows  ${S.wins.size}\nFiles    ${S.fs.size}\nMounts   ${(S.mounts||[]).length}\nKnowledge ${S.knowledge.length}\nWi‑Fi    ${st.wifi}\nBT       ${st.bt}\nHotspot  ${st.hotspot}\nLink     ${st.link}\nCPU      ${S.hardware.cpu.load.toFixed(1)}%\nRAM      ${(S.hardware.ram.used/S.hardware.ram.total*100).toFixed(1)}%\nBattery  ${S.hardware.battery.level.toFixed(0)}%</div>`); }

function appAbout() { createWin('about', 'About', 400, 320, `<div class="pad"><h2 style="margin-bottom:6px">Æther OS · ASI Core</h2><p>Heart = <b>Aether language runtime</b> · Brain = independent mind · VHW Oracle = fabric intelligence.</p><ul style="margin:8px 0;padding-left:18px;font-size:0.8rem;line-height:1.5"><li>Æther language · Playground · Terminal · Examples</li><li>Brain / Heart / VHW Oracle / Pixel Codec</li><li>ASI goal → plan → execute on OS</li><li>HyperFS · Images · Audio · App Builder · Automation · Notifications</li></ul><p style="font-size:0.72rem;color:var(--dim)">See <b>Docs</b> for full API. Open <b>Examples</b> for runnable scripts.</p></div>`); }

function appNotif() { const r = createWin('notifications', 'Notifications', 380, 320, `<div class="pad"><h3>Notification History</h3><div id="notif-history" style="max-height:260px;overflow-y:auto;"></div></div>`); const container = r.el.querySelector('#notif-history'); function render() { container.innerHTML = S.notifications.slice().reverse().map(n => { const time = new Date(n.time).toLocaleTimeString(); const cls = n.type || 'info'; return `<div class="notif-item ${cls}">${n.title ? '<strong>'+n.title+'</strong> ' : ''}${n.msg}<span class="time">${time}</span></div>`; }).join('') || '<div style="color:var(--dim);padding:12px;">No notifications</div>'; } render(); const interval = setInterval(() => { if (document.body.contains(r.el)) render(); else clearInterval(interval); }, 2000); }

  S.automations.forEach(rule => {

console.log('Æther OS Ultimate — language + desktop ready');
</script>
