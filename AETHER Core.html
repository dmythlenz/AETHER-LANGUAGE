// ─── DF — DataFrame ────────────────────────────────────────────────────────
const DF={
  create(rows){if(!Array.isArray(rows)||!rows.length)return{cols:[],data:[],_meta:'empty'};const cols=Object.keys(rows[0]);const data=rows.map(r=>cols.map(c=>r[c]));return{cols,data,_meta:'df'};},
  cols(df){return(df&&df.cols)||[];},
  rows(df){if(!df||!df.data)return[];return df.data.map(row=>Object.fromEntries(df.cols.map((c,i)=>[c,row[i]])));},
  select(df,...keys){const keep=keys.length?keys:df.cols;const idx=keep.map(k=>df.cols.indexOf(k));return{cols:keep,data:df.data.map(r=>idx.map(i=>r[i])),_meta:'df'};},
  filter(df,fn){const rows=df.data.filter((r,i)=>fn(Object.fromEntries(df.cols.map((c,j)=>[c,r[j]])),i));return{cols:df.cols,data:rows,_meta:'df'};},
  group(df,keyCol,aggMap){const groups=new Map();const keyIdx=df.cols.indexOf(keyCol);for(const row of df.data){const key=row[keyIdx];if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row);}const result=[];const aggKeys=Object.keys(aggMap||{});for(const[key,rows]of groups){const row={};row[keyCol]=key;for(const aggKey of aggKeys){const fn=aggMap[aggKey];const values=rows.map(r=>r[df.cols.indexOf(aggKey)]);row[aggKey+'_agg']=typeof fn==='function'?fn(values):null;}result.push(row);}return this.create(result);},
  join(left,right,on,how){how=how||'inner';const lIdx=left.cols.indexOf(on);const rIdx=right.cols.indexOf(on);if(lIdx===-1||rIdx===-1)throw new Error('Join key missing');const result=[];const rMap=new Map();for(const rRow of right.data){const key=rRow[rIdx];if(!rMap.has(key))rMap.set(key,[]);rMap.get(key).push(rRow);}for(const lRow of left.data){const key=lRow[lIdx];const matches=rMap.get(key)||[];if(how==='inner'&&!matches.length)continue;if(!matches.length){const row=Object.fromEntries(left.cols.map((c,i)=>[c,lRow[i]]));for(const c of right.cols)if(c!==on)row[c]=null;result.push(row);}else{for(const rRow of matches){const row=Object.fromEntries(left.cols.map((c,i)=>[c,lRow[i]]));for(const c of right.cols)if(c!==on)row[c]=rRow[right.cols.indexOf(c)];result.push(row);}}}return this.create(result);},
  toCSV(df){let s=(df.cols||[]).join(',')+'\n';for(const row of(df.data||[]))s+=row.join(',')+'\n';return s;}
};
// ─── ACTOR — sync mailbox processes (finite-step safe) ───────────────────
const ACTOR={
  mailboxes:new Map(),nextId:1,
  spawn(behavior){const id='actor_'+(this.nextId++);const mailbox=[];const self={id,mailbox};this.mailboxes.set(id,{id,mailbox,behavior,self,running:true,steps:0});return id;},
  send(to,msg){const proc=this.mailboxes.get(String(to));if(!proc)return null;proc.mailbox.push(msg);return to;},
  // process up to n queued messages for an actor (sync)
  tick(id,n){n=Math.max(1,n|0);const proc=this.mailboxes.get(String(id));if(!proc||!proc.running)return 0;let handled=0;while(handled<n&&proc.mailbox.length){const msg=proc.mailbox.shift();try{if(typeof proc.behavior==='function')proc.behavior(proc.self,msg);}catch(e){}handled++;proc.steps++;}return handled;},
  tickAll(n){n=n||1;let t=0;for(const id of this.mailboxes.keys())t+=this.tick(id,n);return t;},
  receive(id){const proc=this.mailboxes.get(String(id));if(!proc||!proc.mailbox.length)return{ok:false};return{ok:true,msg:proc.mailbox.shift()};},
  stop(id){const proc=this.mailboxes.get(String(id));if(proc){proc.running=false;return true;}return false;},
  stats(){return{actors:this.mailboxes.size,ids:[...this.mailboxes.keys()]};}
};
// ─── FUNC / OPT / LIN / NET / PHYSICS ────────────────────────────────────
const FUNC={
  curry(fn,arity){arity=arity||fn.length;return function curried(...args){if(args.length>=arity)return fn(...args);return(...more)=>curried(...args,...more);};},
  compose(...fns){return x=>fns.reduceRight((acc,fn)=>fn(acc),x);},
  pipe(x,...fns){return fns.reduce((acc,fn)=>fn(acc),x);}
};
const OPT={
  some(v){return{_tag:'some',value:v};},none(){return{_tag:'none'};},
  ok(v){return{_tag:'ok',value:v};},err(e){return{_tag:'err',error:e};},
  isSome(o){return o&&o._tag==='some';},isNone(o){return o&&o._tag==='none';},
  isOk(o){return o&&o._tag==='ok';},isErr(o){return o&&o._tag==='err';},
  unwrap(o){if(o&&(o._tag==='some'||o._tag==='ok'))return o.value;throw new Error('Unwrap on None/Err');},
  unwrapOr(o,def){return(o&&(o._tag==='some'||o._tag==='ok'))?o.value:def;},
  map(o,fn){if(o&&(o._tag==='some'||o._tag==='ok'))return{_tag:o._tag,value:fn(o.value)};return o;}
};
const LIN={
  linspace(start,end,num){num=Math.max(2,Number(num)||10);const step=(end-start)/(num-1);const arr=[];for(let i=0;i<num;i++)arr.push(start+i*step);return arr;},
  eye(n){n=Number(n)||3;return Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));},
  zeros(n,m){n=Number(n)||3;m=Number(m)||n;return Array.from({length:n},()=>Array.from({length:m},()=>0));},
  ones(n,m){n=Number(n)||3;m=Number(m)||n;return Array.from({length:n},()=>Array.from({length:m},()=>1));},
  dot(a,b){if(!Array.isArray(a)||!Array.isArray(b))return null;const n=Math.min(a.length,b.length);let s=0;for(let i=0;i<n;i++)s+=a[i]*b[i];return s;},
  cross(a,b){if(!a||!b||a.length<3||b.length<3)return null;return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];},
  norm(v,order){order=Number(order)||2;if(!Array.isArray(v))return 0;if(order===1)return v.reduce((s,x)=>s+Math.abs(x),0);if(order===2)return Math.sqrt(v.reduce((s,x)=>s+x*x,0));if(order===Infinity)return Math.max(...v.map(Math.abs));return 0;}
};
const NET={
  servers:new Map(),
  listen(port,handler){const id='svr_'+port;this.servers.set(id,{port,handler,requests:0});return id;},
  request(url,method,body){const match=String(url).match(/^https?:\/\/localhost:(\d+)(\/.*)?/);if(!match)return{status:404,body:'Not found'};const port=parseInt(match[1],10);const path=match[2]||'/';const svr=this.servers.get('svr_'+port);if(!svr)return{status:503,body:'Server not found'};svr.requests++;try{const response=typeof svr.handler==='function'?svr.handler({method:method||'GET',path,body}):{status:200,body:'ok'};return response||{status:204};}catch(e){return{status:500,body:String(e.message||e)};}},
  stats(){return{servers:this.servers.size,requests:[...this.servers.values()].reduce((s,v)=>s+v.requests,0)};}
};
const PHYSICS={
  objects:new Map(),

// ─── AUTOMATION — workflows, triggers, schedules ───────────────────────────
const AUTO={
  workflows:new Map(),runs:new Map(),triggers:new Map(),nextId:1,
  define(name,steps){const id=String(name);this.workflows.set(id,{name:id,steps:Array.isArray(steps)?steps:[],ts:HOST.now()});return id;},
  run(name,ctx){
    const wf=this.workflows.get(String(name));if(!wf)throw new Error('No workflow: '+name);
    const rid='run_'+(this.nextId++);const log=[];let data=ctx||{};
    for(const step of wf.steps){
      try{
        if(typeof step==='function'){data=step(data)??data;log.push({ok:true});}
        else if(step&&typeof step.fn==='function'){data=step.fn(data)??data;log.push({name:step.name||'step',ok:true});}
        else log.push({ok:false,error:'bad step'});
      }catch(e){log.push({ok:false,error:String(e.message||e)});break;}
    }
    const rec={id:rid,workflow:wf.name,log,data,ts:HOST.now()};this.runs.set(rid,rec);return rec;
  },
  on(event,handler){const k=String(event);if(!this.triggers.has(k))this.triggers.set(k,[]);this.triggers.get(k).push(handler);return k;},
  emit(event,payload){const hs=this.triggers.get(String(event))||[];const out=[];for(const h of hs){try{out.push(typeof h==='function'?h(payload):null);}catch(e){out.push({error:String(e.message||e)});}}return out;},
  schedule(name,everyMs){return{name:String(name),every_ms:everyMs|0,note:'cooperative schedule record'};},
  stats(){return{workflows:this.workflows.size,runs:this.runs.size,triggers:this.triggers.size};}
};

// ─── CAG — Cache Augmented Generation ──────────────────────────────────────
const CAG={
  cache:new Map(),hits:0,misses:0,
  put(key,value,ttl){this.cache.set(String(key),{value,ttl:ttl||0,ts:HOST.now()});return key;},
  get(key){const e=this.cache.get(String(key));if(!e){this.misses++;return null;}this.hits++;return e.value;},
  getOrCompute(key,fn){const hit=this.get(key);if(hit!==null&&hit!==undefined)return{hit:true,value:hit};const value=typeof fn==='function'?fn():fn;this.put(key,value);this.misses++;return{hit:false,value};},
  clear(){this.cache.clear();this.hits=0;this.misses=0;},
  stats(){return{entries:this.cache.size,hits:this.hits,misses:this.misses,ratio:this.hits+this.misses?(this.hits/(this.hits+this.misses)):0};}

// ─── RAG — Retrieval Augmented Generation (retrieve + stub generate) ─────
const RAG={
  index:new Map(),
  add(id,text,meta){const doc={id:String(id),text:String(text),meta:meta||{},tokens:String(text).toLowerCase().split(/\W+/).filter(Boolean)};this.index.set(doc.id,doc);return doc.id;},
  retrieve(query,k){
    k=Math.max(1,k|0||3);const q=String(query).toLowerCase().split(/\W+/).filter(Boolean);const scored=[];
    for(const doc of this.index.values()){let score=0;for(const t of q)if(doc.tokens.includes(t))score++;if(score)scored.push({id:doc.id,score,text:doc.text,meta:doc.meta});}
    return scored.sort((a,b)=>b.score-a.score).slice(0,k);
  },
  generate(query,k){
    const hits=this.retrieve(query,k||3);
    const context=hits.map(h=>h.text).join('\n---\n');
    const answer=hits.length?('[RAG] Based on '+hits.length+' docs: '+hits[0].text.slice(0,120)):'[RAG] No context retrieved.';
    return{query:String(query),hits,context:context.slice(0,500),answer};
  },
  stats(){return{docs:this.index.size};}
};
// ─── DAG — directed acyclic task graph ─────────────────────────────────────
const DAG={
  graphs:new Map(),
  create(name){const g={name:String(name),nodes:new Map(),edges:[]};this.graphs.set(g.name,g);return g.name;},
  add(name,nodeId,fn){const g=this.graphs.get(String(name));if(!g)throw new Error('No DAG');g.nodes.set(String(nodeId),{id:String(nodeId),fn:fn||null,result:null});return nodeId;},
  link(name,from,to){const g=this.graphs.get(String(name));if(!g)throw new Error('No DAG');g.edges.push({from:String(from),to:String(to)});return g.edges.length;},
  // Kahn topological run
  run(name,seed){
    const g=this.graphs.get(String(name));if(!g)throw new Error('No DAG');
    const indeg=new Map();for(const id of g.nodes.keys())indeg.set(id,0);
    for(const e of g.edges)indeg.set(e.to,(indeg.get(e.to)||0)+1);
    const q=[...indeg.entries()].filter(([,d])=>d===0).map(([id])=>id);
    const order=[];const results={};let data=seed;
    while(q.length){
      const id=q.shift();order.push(id);const node=g.nodes.get(id);
      try{results[id]=typeof node.fn==='function'?node.fn(data,results):data;if(results[id]!==undefined)data=results[id];node.result=results[id];}catch(e){results[id]={error:String(e.message||e)};}
      for(const e of g.edges){if(e.from===id){indeg.set(e.to,indeg.get(e.to)-1);if(indeg.get(e.to)===0)q.push(e.to);}}
    }
    if(order.length!==g.nodes.size)return{ok:false,error:'cycle detected',order,results};
    return{ok:true,order,results};
  },
  stats(){return{graphs:this.graphs.size};}
};

  unmask(token){const e=this.masks.get(String(token));return e?e.value:null;},

  deobfuscate(s){try{s=String(s);let o='';for(let i=0;i<s.length;i+=2){o+=String.fromCharCode(parseInt(s.slice(i,i+2),16)^0x5A);}return o;}catch(e){return null;}},

// ─── KOS advanced — path query / infer ─────────────────────────────────────
const KOS_X={
  path(from,to,maxDepth){
    maxDepth=maxDepth||4;const start=String(from),goal=String(to);
    const q=[[start]];const seen=new Set([start]);
    while(q.length){
      const path=q.shift();const cur=path[path.length-1];
      if(cur===goal)return path;
      if(path.length>maxDepth)continue;
      for(const n of KOS.neighbors(cur)){
        if(!seen.has(n.id)){seen.add(n.id);q.push(path.concat([n.id]));}
      }
    }
    return null;
  },

// ─── Hierarchical FS (files + folders) ─────────────────────────────────────
const FS={
  // path -> { type:'file'|'dir', content?, children?, ts, meta }
  nodes:new Map(),
  normalize(path){path=String(path||'/');if(!path.startsWith('/'))path='/'+path;path=path.replace(/\/+/g,'/');if(path.length>1&&path.endsWith('/'))path=path.slice(0,-1);return path;},
  parent(path){path=this.normalize(path);if(path==='/')return null;const i=path.lastIndexOf('/');return i===0?'/':path.slice(0,i);},
  ensureDir(path){
    path=this.normalize(path);
    if(path==='/'){if(!this.nodes.has('/'))this.nodes.set('/',{type:'dir',children:new Set(),ts:HOST.now()});return;}
    const parts=path.split('/').filter(Boolean);
    let cur='/';
    this.ensureDir('/');
    for(const p of parts){
      const next=cur==='/'?'/'+p:cur+'/'+p;
      if(!this.nodes.has(next)){
        this.nodes.set(next,{type:'dir',children:new Set(),ts:HOST.now()});
        this.nodes.get(cur).children.add(next);
      }else if(this.nodes.get(next).type!=='dir')throw new Error('ENOTDIR: '+next);
      cur=next;
    }
  },
  write(path,content,meta){
    path=this.normalize(path);
    const parent=this.parent(path);
    if(parent)this.ensureDir(parent);
    const prev=this.nodes.get(path);
    if(prev&&prev.type==='dir')throw new Error('EISDIR: '+path);
    this.nodes.set(path,{type:'file',content:String(content),meta:meta||{},ts:HOST.now()});
    if(parent)this.nodes.get(parent).children.add(path);
    return path;
  },
  read(path){
    path=this.normalize(path);
    const n=this.nodes.get(path);
    if(!n)throw new Error('ENOENT: '+path);
    if(n.type==='dir')throw new Error('EISDIR: '+path);
    return n.content;
  },
  mkdir(path){this.ensureDir(path);return this.normalize(path);},
  exists(path){return this.nodes.has(this.normalize(path));},
  isDir(path){const n=this.nodes.get(this.normalize(path));return n&&n.type==='dir';},
  isFile(path){const n=this.nodes.get(this.normalize(path));return n&&n.type==='file';},
  list(path){
    path=this.normalize(path||'/');
    const n=this.nodes.get(path);
    if(!n)throw new Error('ENOENT: '+path);
    if(n.type!=='dir')throw new Error('ENOTDIR: '+path);
    return [...n.children].sort();
  },
  tree(path,depth){
    path=this.normalize(path||'/');depth=depth==null?8:depth;
    const walk=(p,d)=>{
      const n=this.nodes.get(p);if(!n)return null;
      if(n.type==='file')return{path:p,type:'file',bytes:(n.content||'').length,meta:n.meta};
      const kids=d>0?[...n.children].sort().map(c=>walk(c,d-1)).filter(Boolean):[];
      return{path:p,type:'dir',children:kids};
    };
    return walk(path,depth);
  },
  remove(path){
    path=this.normalize(path);
    const n=this.nodes.get(path);if(!n)return false;
    if(n.type==='dir'&&n.children.size)throw new Error('ENOTEMPTY: '+path);
    this.nodes.delete(path);
    const parent=this.parent(path);
    if(parent&&this.nodes.has(parent))this.nodes.get(parent).children.delete(path);
    return true;
  },
  // scan folder → list of files
  scan(path){
    path=this.normalize(path||'/');
    const out=[];
    const walk=(p)=>{
      const n=this.nodes.get(p);if(!n)return;
      if(n.type==='file')out.push({path:p,bytes:(n.content||'').length,meta:n.meta});
      else for(const c of n.children)walk(c);
    };
    walk(path);return out;
  },
  // load file → pixel
  toPixel(path){
    const content=this.read(path);
    return PX.ingest('file',path,content);
  },
  // download sim: create file from content
  download(path,content,meta){return this.write(path,content,{...(meta||{}),downloaded:true,ts:HOST.now()});},
  stats(){
    let files=0,dirs=0,bytes=0;
    for(const n of this.nodes.values()){if(n.type==='file'){files++;bytes+=(n.content||'').length;}else dirs++;}
    return{files,dirs,bytes,nodes:this.nodes.size};
  }
};

  const sel=$('exSel');for(const k of Object.keys(EXAMPLES)){const o=document.createElement('option');o.value=k;o.textContent=k;sel.appendChild(o);}
  sel.onchange=()=>{if(sel.value&&EXAMPLES[sel.value])editor.value=EXAMPLES[sel.value];sel.value='';};
  $('btnRun').onclick=runCode;$('btnClear').onclick=()=>{clearOut();};
  $('btnStatus').onclick=()=>{clearOut();write(JSON.stringify(AETHER_CORE.status(),null,2),'info');};
  $('btnApex').onclick=()=>{clearOut();const r=AETHER_CORE.selfTest();for(const line of r.lines)write(line,line.startsWith('✓')?'ok':(line.startsWith('✗')?'err':'info'));};
  $('btnDocs').onclick=()=>{clearOut();write(DOCS.help('all'),'info');};
  editor.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();runCode();}if(e.key==='Tab'){e.preventDefault();const s=editor.selectionStart;editor.value=editor.value.slice(0,s)+'  '+editor.value.slice(editor.selectionEnd);editor.selectionStart=editor.selectionEnd=s+2;}});

  let chatOpen=false;
  $('btnChat').onclick=()=>{chatOpen=!chatOpen;$('chat').classList.toggle('open',chatOpen);editor.style.display=chatOpen?'none':'block';};
  function addChat(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;$('chatlog').appendChild(d);$('chatlog').scrollTop=$('chatlog').scrollHeight;}
  function handleChat(text){
    addChat(text,'user');
    const code=text.match(/```(?:aether)?\s*([\s\S]*?)```/i);
    if(code){const r=AETHER_CORE.run(code[1]);addChat((r.output.join('\n')||r.error||'(ok)'),'bot');return;}
    if(text.startsWith('/')){if(text==='/status')addChat(JSON.stringify(AETHER_CORE.status(),null,2),'bot');else if(text==='/apex'){const r=AETHER_CORE.selfTest();addChat(r.lines.join('\n'),'bot');}else if(text.startsWith('/help'))addChat(DOCS.help(text.slice(6).trim()||'all'),'bot');else addChat('/status /apex /help [topic]','bot');return;}
    const lower=text.toLowerCase();
    if(/hello|who are you/.test(lower))addChat('AETHER Core v1.0.0 — Foundation.\nHierarchical FS · Pixel ingest (file/image/video/3d/anim/game/llm) · Full VHW · Host: '+HOST.kind,'bot');
    else if(/fs|folder|pixel|ingest|vhw|image/.test(lower))addChat(DOCS.help(/vhw/.test(lower)?'vhw':/image|anim/.test(lower)?'image':/pixel|ingest/.test(lower)?'pixel':'fs'),'bot');
    else addChat('Examples dropdown · ```aether fs_tree("/")``` · /apex · /help fs','bot');
  }
  $('btnSend').onclick=()=>{const t=$('chatIn').value.trim();if(!t)return;$('chatIn').value='';handleChat(t);};
  $('chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('btnSend').click();}});

  editor.value=EXAMPLES['Hello']+'\n\n'+EXAMPLES['Pixel Ingest All'];
  write('AETHER Core v1.0.0 — FINAL single-file online','sys');
  write('Foundation · stack examples · find/has · apex 22+','sys');
  updateStatus();runCode();
}else HOST.log('AETHER Core v1.0.0 ready host='+HOST.kind);
